<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestra Historia Especial</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Firebase SDKs (Compat / Modular) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        burgundy: { 800: '#58111A', 900: '#3B0A11', 950: '#230408' },
                        rose: { 300: '#F472B6', 500: '#EC4899', 600: '#DB2777', 900: '#831843' },
                        gold: { 400: '#FBBF24', 500: '#F59E0B' }
                    },
                    fontFamily: {
                        cursive: ['"Dancing Script"', 'cursive'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #230408 0%, #3B0A11 50%, #58111A 100%); color: #FCE7F3; overflow-x: hidden; touch-action: manipulation; }
        .font-cursive { font-family: 'Dancing Script', cursive; }
        .carousel-track { display: flex; transition: transform 0.4s cubic-bezier(0.25, 1, 0.25, 1); }
        #heartFill { transition: height 0.25s ease-out; }
        .bg-heart { position: absolute; opacity: 0.15; animation: floatUp linear infinite; pointer-events: none; }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5) rotate(0deg); opacity: 0; }
            50% { opacity: 0.25; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body class="min-h-screen relative pb-20 antialiased">

    <div id="bg-hearts-container" class="fixed inset-0 overflow-hidden pointer-events-none z-0"></div>

    <!-- PANTALLA DE CARGA / ERROR -->
    <div id="loadingScreen" class="min-h-screen flex flex-col items-center justify-center p-6 text-center relative z-20">
        <div class="w-full max-w-sm bg-burgundy-900/60 backdrop-blur-xl border border-rose-500/20 p-8 rounded-3xl shadow-2xl">
            <div id="spinner" class="animate-spin rounded-full h-12 w-12 border-b-2 border-rose-500 mx-auto mb-4"></div>
            <p id="loadingText" class="text-xs text-rose-300">Cargando tu sorpresa de amor...</p>
        </div>
    </div>

    <!-- REPRODUCTOR DE MÚSICA FLOTANTE -->
    <div id="musicPlayerContainer" class="hidden fixed top-4 left-1/2 -translate-x-1/2 z-50 w-11/12 max-w-sm">
        <div class="bg-burgundy-950/85 backdrop-blur-md border border-rose-500/30 rounded-full px-4 py-2.5 flex items-center justify-between shadow-2xl">
            <div class="flex items-center space-x-3 overflow-hidden">
                <button id="musicBtn" onclick="toggleAudio()" class="w-10 h-10 rounded-full bg-gradient-to-r from-rose-500 to-rose-600 text-white flex items-center justify-center flex-shrink-0 shadow-lg active:scale-95 transition-transform">
                    <i id="playIcon" class="fas fa-play text-xs ml-0.5"></i>
                </button>
                <div class="truncate">
                    <p class="text-xs font-semibold text-rose-200 truncate">Nuestra Canción</p>
                    <p id="musicStatus" class="text-[10px] text-rose-400/80 truncate">Toca para reproducir</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <i class="fas fa-volume-up text-xs text-rose-300"></i>
                <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="0.8" oninput="adjustVolume(this.value)" class="w-16 h-1 accent-rose-500 bg-rose-950 rounded-lg cursor-pointer">
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto"></audio>

    <!-- PANTALLA DE DESBLOQUEO CON CORAZÓN -->
    <section id="heart-game-section" class="hidden min-h-screen flex flex-col items-center justify-center p-6 text-center relative z-10">
        <div class="w-full max-w-sm bg-burgundy-900/60 backdrop-blur-xl border border-rose-500/20 p-8 rounded-3xl shadow-2xl relative overflow-hidden">
            <span class="inline-block px-3 py-1 bg-rose-500/20 text-rose-300 border border-rose-500/30 rounded-full text-xs font-semibold uppercase tracking-widest mb-4">
                Regalo Especial
            </span>
            <h1 class="text-3xl font-bold font-cursive text-rose-100 mb-2">Desbloquea Mi Sorpresa</h1>
            <p class="text-xs text-rose-300/80 mb-6">Toca el corazón para llenarlo de amor...</p>

            <div id="heartContainer" onclick="handleHeartClick()" class="relative w-36 h-36 mx-auto mb-6 cursor-pointer select-none transition-transform duration-150 flex items-center justify-center">
                <svg class="absolute inset-0 w-full h-full text-burgundy-950 fill-current drop-shadow-lg" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
                <div id="heartFill" class="absolute bottom-0 left-0 w-full overflow-hidden" style="height: 0%;">
                    <svg class="w-36 h-36 text-rose-500 fill-current absolute bottom-0 left-0 drop-shadow-[0_0_15px_rgba(236,72,153,0.8)]" viewBox="0 0 24 24">
                        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                    </svg>
                </div>
                <span id="clickCounter" class="relative z-10 text-xl font-bold text-white drop-shadow-md">0 / 10</span>
            </div>
            <p id="tapHint" class="text-xs text-rose-300 italic font-medium animate-pulse">¡Haz clic o toca aquí!</p>
        </div>
    </section>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="mainContent" class="hidden opacity-0 transition-opacity duration-1000 z-10 relative pt-20 px-4 max-w-md mx-auto space-y-10">
        <div class="text-center space-y-2 py-2">
            <h2 id="mainTitle" class="text-4xl font-cursive font-bold text-transparent bg-clip-text bg-gradient-to-r from-rose-300 via-rose-100 to-gold-400">
                Nuestra Historia
            </h2>
            <p id="mainDate" class="text-xs text-rose-300/80 uppercase tracking-widest"></p>
        </div>

        <!-- CARRUSEL DE FOTOS DINÁMICO -->
        <section class="bg-burgundy-900/50 backdrop-blur-lg border border-rose-500/20 rounded-3xl p-5 shadow-2xl space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="text-base font-bold text-rose-100 flex items-center gap-2">
                    <i class="fas fa-camera-retro text-rose-400"></i> Galería de Recuerdos
                </h3>
                <span id="carouselIndicator" class="text-xs text-rose-300/70 font-semibold">1 / 1</span>
            </div>

            <div id="carouselViewport" class="overflow-hidden rounded-2xl relative touch-pan-y" ontouchstart="handleTouchStart(event)" ontouchmove="handleTouchMove(event)" ontouchend="handleTouchEnd()">
                <div id="carouselTrack" class="carousel-track"></div>
            </div>

            <div class="flex items-center justify-between pt-2">
                <button onclick="prevSlide()" class="w-9 h-9 rounded-full bg-burgundy-950/80 border border-rose-500/30 text-rose-200 flex items-center justify-center active:scale-95"><i class="fas fa-chevron-left text-xs"></i></button>
                <div class="flex space-x-2" id="carouselDots"></div>
                <button onclick="nextSlide()" class="w-9 h-9 rounded-full bg-burgundy-950/80 border border-rose-500/30 text-rose-200 flex items-center justify-center active:scale-95"><i class="fas fa-chevron-right text-xs"></i></button>
            </div>
        </section>

        <!-- CARTA DIGITAL -->
        <section class="bg-burgundy-900/50 backdrop-blur-lg border border-rose-500/20 rounded-3xl p-5 shadow-2xl space-y-4">
            <h3 class="text-base font-bold text-rose-100 flex items-center gap-2">
                <i class="fas fa-envelope-open-text text-rose-400"></i> Mensaje Especial
            </h3>
            <div class="bg-burgundy-950/70 p-5 rounded-2xl border border-rose-500/10 text-xs leading-relaxed text-rose-200/90 font-sans">
                <p id="cardMessage" class="whitespace-pre-line"></p>
            </div>
        </section>

        <footer class="text-center py-6 text-xs text-rose-400/60 space-y-1">
            <p class="font-cursive text-lg text-rose-300">Con todo mi amor ❤️</p>
        </footer>
    </main>

    <script>
        // Configuración Firebase (Reemplaza con tus datos)
        const firebaseConfig = {
  apiKey: "AIzaSyC-PGLDqJ2GLfm3ZaXdSxxlvm8MerM1nJY",
  authDomain: "appdetallesamor.firebaseapp.com",
  projectId: "appdetallesamor",
  storageBucket: "appdetallesamor.firebasestorage.app",
  messagingSenderId: "917968456649",
  appId: "1:917968456649:web:32261e841942825685b618",
  measurementId: "G-ZTGDLNQXSF"
};
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let photosArray = [];
        let currentSlide = 0;
        let totalSlides = 1;
        let touchStartX = 0, touchEndX = 0;

        // Cargar Datos desde Firestore usando ?id=
        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('id');

        if (!docId) {
            showError("No se encontró el identificador de la tarjeta.");
        } else {
            db.collection("detalles").doc(docId).get().then((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('loadingScreen').classList.add('hidden');
                    document.getElementById('heart-game-section').classList.remove('hidden');
                    document.getElementById('musicPlayerContainer').classList.remove('hidden');

                    // Asignar textos
                    document.getElementById('mainTitle').innerText = `Nuestra Historia: ${data.nombres || ''}`;
                    document.getElementById('mainDate').innerText = data.fecha || '';
                    document.getElementById('cardMessage').innerText = data.mensaje || '';

                    // Configurar Música si existe
                    if (data.audioBase64) {
                        document.getElementById('bgMusic').src = data.audioBase64;
                    } else {
                        document.getElementById('bgMusic').src = "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-112185.mp3";
                    }

                    // Configurar Galería de Fotos
                    photosArray = data.fotos || [];
                    totalSlides = photosArray.length > 0 ? photosArray.length : 1;
                    buildCarousel();

                } else {
                    showError("La tarjeta no existe o fue eliminada.");
                }
            }).catch((error) => {
                showError("Ocurrió un error al cargar la información.");
            });
        }

        function showError(msg) {
            document.getElementById('loadingScreen').innerHTML = `
                <div class="w-full max-w-sm bg-burgundy-900/60 p-8 rounded-3xl border border-rose-500/20">
                    <h2 class="text-xl font-bold text-rose-400 mb-2">Error</h2>
                    <p class="text-xs text-rose-200">${msg}</p>
                </div>
            `;
        }

        // --- AUDIO ---
        const bgMusic = document.getElementById('bgMusic');
        const playIcon = document.getElementById('playIcon');
        const musicStatus = document.getElementById('musicStatus');
        let isMusicPlaying = false;

        function toggleAudio() {
            if (isMusicPlaying) {
                bgMusic.pause();
                playIcon.className = 'fas fa-play text-xs ml-0.5';
                musicStatus.innerText = 'Pausado';
            } else {
                bgMusic.play().then(() => {
                    playIcon.className = 'fas fa-pause text-xs';
                    musicStatus.innerText = 'Reproduciendo ❤️';
                }).catch(() => {});
            }
            isMusicPlaying = !isMusicPlaying;
        }
        function adjustVolume(val) { bgMusic.volume = val; }

        // --- CORAZÓN INTERACTIVO ---
        let heartClicks = 0;
        const targetClicks = 10;
        let musicAutoTriggered = false;

        function handleHeartClick() {
            if (!musicAutoTriggered && !isMusicPlaying) {
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    playIcon.className = 'fas fa-pause text-xs';
                    musicStatus.innerText = 'Reproduciendo ❤️';
                    musicAutoTriggered = true;
                }).catch(() => {});
            }

            if (heartClicks < targetClicks) {
                heartClicks++;
                const fillPercentage = Math.round((heartClicks / targetClicks) * 100);
                document.getElementById('heartFill').style.height = `${fillPercentage}%`;
                document.getElementById('clickCounter').innerText = `${heartClicks} / ${targetClicks}`;

                const container = document.getElementById('heartContainer');
                container.classList.add('scale-110');
                setTimeout(() => container.classList.remove('scale-110'), 150);

                if (heartClicks === targetClicks) {
                    document.getElementById('tapHint').innerText = "¡Desbloqueado! ❤️";
                    if (typeof confetti === 'function') {
                        confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
                    }
                    setTimeout(() => {
                        const gameSec = document.getElementById('heart-game-section');
                        const mainContent = document.getElementById('mainContent');
                        gameSec.style.transition = 'all 0.6s ease-out';
                        gameSec.style.opacity = '0';
                        setTimeout(() => {
                            gameSec.classList.add('hidden');
                            mainContent.classList.remove('hidden');
                            setTimeout(() => mainContent.classList.remove('opacity-0'), 50);
                        }, 600);
                    }, 400);
                }
            }
        }

        // --- CARRUSEL ---
        function buildCarousel() {
            const track = document.getElementById('carouselTrack');
            const dotsContainer = document.getElementById('carouselDots');
            track.innerHTML = '';
            dotsContainer.innerHTML = '';

            photosArray.forEach((photo, idx) => {
                const slideDiv = document.createElement('div');
                slideDiv.className = 'w-full flex-shrink-0 relative';
                slideDiv.innerHTML = `
                    <div class="aspect-[4/5] w-full rounded-2xl overflow-hidden bg-burgundy-950 relative">
                        <img src="${photo}" alt="Foto ${idx+1}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-burgundy-950 via-transparent to-transparent opacity-80"></div>
                        <div class="absolute bottom-0 inset-x-0 p-4">
                            <span class="text-[10px] bg-rose-500/30 text-rose-200 border border-rose-400/30 px-2 py-0.5 rounded-full font-mono">Recuerdo ${idx + 1}</span>
                        </div>
                    </div>
                `;
                track.appendChild(slideDiv);

                const dot = document.createElement('span');
                dot.className = idx === 0 ? 'w-2.5 h-2.5 rounded-full bg-rose-500' : 'w-2.5 h-2.5 rounded-full bg-rose-950 border border-rose-500/40';
                dotsContainer.appendChild(dot);
            });
            updateCarousel();
        }

        function updateCarousel() {
            const track = document.getElementById('carouselTrack');
            track.style.transform = `translateX(-${currentSlide * 100}%)`;
            document.getElementById('carouselIndicator').innerText = `${currentSlide + 1} / ${totalSlides}`;
            const dots = document.getElementById('carouselDots').children;
            for (let i = 0; i < dots.length; i++) {
                dots[i].className = i === currentSlide ? 'w-2.5 h-2.5 rounded-full bg-rose-500' : 'w-2.5 h-2.5 rounded-full bg-rose-950 border border-rose-500/40';
            }
        }

        function nextSlide() { currentSlide = (currentSlide + 1) % totalSlides; updateCarousel(); }
        function prevSlide() { currentSlide = (currentSlide - 1 + totalSlides) % totalSlides; updateCarousel(); }

        function handleTouchStart(e) { touchStartX = e.changedTouches[0].screenX; }
        function handleTouchMove(e) { touchEndX = e.changedTouches[0].screenX; }
        function handleTouchEnd() {
            if (touchStartX - touchEndX > 40) nextSlide();
            else if (touchEndX - touchStartX > 40) prevSlide();
        }

        function initFloatingHearts() {
            const container = document.getElementById('bg-hearts-container');
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('i');
                heart.className = 'fas fa-heart bg-heart text-rose-500';
                heart.style.left = `${Math.random() * 100}%`;
                heart.style.animationDuration = `${6 + Math.random() * 8}s`;
                heart.style.animationDelay = `${Math.random() * 5}s`;
                heart.style.fontSize = `${12 + Math.random() * 18}px`;
                container.appendChild(heart);
            }
        }
        window.onload = initFloatingHearts;
    </script>
</body>
      </html>
