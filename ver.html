<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu Detalle Especial ❤️</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 min-h-screen flex items-center justify-center p-4">

  <div id="tarjetaContenedor" class="bg-white max-w-sm w-full rounded-3xl shadow-xl p-6 text-center space-y-4 border border-pink-100 relative">
    
    <!-- ETIQUETA ENCABEZADO -->
    <span class="bg-pink-100 text-pink-600 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">
      Un regalo para ti
    </span>

    <!-- NOMBRES Y FECHA -->
    <h1 id="tituloNombres" class="text-2xl font-extrabold text-pink-600 pt-2">Cargando...</h1>
    <p id="textoFecha" class="text-xs text-gray-400 font-medium"></p>

    <!-- CARRUSEL / CONTENEDOR DE FOTOS -->
    <div id="carruselFotos" class="space-y-2 pt-2"></div>

    <!-- CARTA DE MENSAJE -->
    <div class="bg-pink-50/60 p-4 rounded-2xl border border-pink-100 text-left">
      <p id="textoMensaje" class="text-sm text-gray-700 leading-relaxed whitespace-pre-line"></p>
    </div>

    <!-- PIE DE PÁGINA -->
    <div class="pt-4 border-t border-gray-100 text-xs text-gray-400">
      Hecho con ❤️ en <span class="font-bold text-pink-500">AppDetallesAmor</span>
    </div>
  </div>

  <!-- MÓDULO FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Reemplaza con tu configuración de Firebase si es distinta
    const firebaseConfig = {
  apiKey: "AIzaSyC-PGLDqJ2GLfm3ZaXdSxxlvm8MerM1nJY",
  authDomain: "appdetallesamor.firebaseapp.com",
  projectId: "appdetallesamor",
  storageBucket: "appdetallesamor.firebasestorage.app",
  messagingSenderId: "917968456649",
  appId: "1:917968456649:web:32261e841942825685b618",
  measurementId: "G-ZTGDLNQXSF"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function cargarDetalle() {
      const urlParams = new URLSearchParams(window.location.search);
      const idDetalle = urlParams.get('id');

      if (!idDetalle) {
        document.getElementById('tituloNombres').innerText = "Detalle no encontrado";
        document.getElementById('textoMensaje').innerText = "No se proporcionó un ID válido en el enlace.";
        return;
      }

      try {
        const docRef = doc(db, "detalles", idDetalle);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const datos = docSnap.data();

          document.getElementById('tituloNombres').innerText = datos.nombres || "";
          document.getElementById('textoFecha').innerText = datos.fecha ? `📅 ${datos.fecha}` : "";
          document.getElementById('textoMensaje').innerText = datos.mensaje || "";

          // Renderizar fotos si existen
          if (datos.fotos && datos.fotos.length > 0) {
            const carrusel = document.getElementById('carruselFotos');
            carrusel.innerHTML = datos.fotos.map(foto => `
              <img src="${foto}" class="w-full h-52 object-cover rounded-2xl shadow-sm border border-gray-100" alt="Foto del detalle">
            `).join('');
          }
        } else {
          document.getElementById('tituloNombres').innerText = "Detalle no encontrado";
          document.getElementById('textoMensaje').innerText = "Este detalle no existe o fue eliminado.";
        }
      } catch (error) {
        console.error("Error al cargar detalle:", error);
        document.getElementById('tituloNombres').innerText = "Error";
        document.getElementById('textoMensaje').innerText = "Ocurrió un error al cargar la información desde la base de datos.";
      }
    }

    cargarDetalle();
  </script>
</body>
</html>
