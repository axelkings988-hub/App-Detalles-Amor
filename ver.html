<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

    const statusText = document.getElementById('statusText');
    const spinner = document.getElementById('spinner');

    function showError(msg) {
        if (spinner) spinner.classList.add('hidden');
        if (statusText) {
            statusText.className = "text-red-500 font-bold p-4 bg-white rounded-xl shadow";
            statusText.innerHTML = msg;
        }
    }

    const firebaseConfig = {
        apiKey: "AIzaSyC-PGLDqJ2GLfm3ZaXdSxxlvm8MerM1nJY",
        authDomain: "appdetallesamor.firebaseapp.com",
        projectId: "appdetallesamor",
        storageBucket: "appdetallesamor.firebasestorage.app",
        messagingSenderId: "917968456649",
        appId: "1:917968456649:web:24759220e7e129a085b618",
        measurementId: "G-X2NGZ3HC41"
    };

    try {
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        let siteId = urlParams.get('id');

        if (siteId) {
            // Limpia automáticamente corchetes, paréntesis o espacios accidentales
            siteId = siteId.replace(/[^\w]/g, '');
        }

        if (!siteId) {
            showError("❌ No se especificó ningún ID en el enlace.");
        } else {
            const docRef = doc(db, "minisites", siteId);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('title').textContent = data.names || 'Nuestra Historia';
                document.getElementById('date').textContent = data.specialDate ? `📅 ${data.specialDate}` : '';
                document.getElementById('message').textContent = data.loveLetter || '';

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('content').classList.remove('hidden');
            } else {
                showError("💔 El registro no existe en la base de datos.");
            }
        }
    } catch (err) {
        showError("⚠️ Error de conexión: " + err.message);
    }
</script>
