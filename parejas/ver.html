<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nuestra Postal Especial - Dilo D' QRazón</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        burgundy: { 800: '#58111A', 900: '#3B0A11', 950: '#230408' },
                        rose: { 300: '#F472B6', 500: '#EC4899', 600: '#DB2777', 900: '#831843' },
                        gold: { 400: '#FBBF24', 500: '#F59E0B' }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #230408; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
        }

        /* Contenedor principal con la proporción exacta de tu postal en JPG[span_1](start_span)[span_1](end_span) */
        .postal-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            aspect-ratio: 700 / 1000;
            background-image: url('diseño-postal.jpg');
            background-size: cover;
            background-position: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.6);
            border-radius: 1rem;
            overflow: hidden;
        }

        /* Contenedor del QR posicionado exactamente sobre el cuadro blanco[span_2](start_span)[span_2](end_span) */
        #qr-slot {
            position: absolute;
            top: 41.5%;
            left: 55.2%;
            width: 31.5%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            padding: 4px;
            border-radius: 4px;
        }

        #qrcode img {
            width: 100% !important;
            height: 100% !important;
        }

        /* Ocultar botones e interfaz al momento de imprimir la postal limpia */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
            .postal-container { box-shadow: none !important; width: 100% !important; max-width: 100% !important; border-radius: 0 !important; }
        }
    </style>
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen">

    <!-- PANTALLA DE CARGA / ERROR -->
    <div id="loadingScreen" class="fixed inset-0 bg-burgundy-950 z-50 flex flex-col items-center justify-center p-6 text-center">
        <div class="w-full max-w-sm bg-burgundy-900/60 backdrop-blur-xl border border-rose-500/20 p-8 rounded-3xl shadow-2xl space-y-4">
            <div id="spinner" class="animate-spin rounded-full h-12 w-12 border-b-2 border-rose-500 mx-auto mb-4"></div>
            <p id="loadingText" class="text-xs text-rose-300">Cargando postal de amor...</p>
        </div>
    </div>

    <!-- CONTENEDOR DE LA POSTAL CON LA IMAGEN DE FONDO[span_3](start_span)[span_3](end_span) -->
    <div class="postal-container my-auto">
        <!-- El código QR generado se inyectará automáticamente en este cuadro blanco[span_4](start_span)[span_4](end_span) -->
        <div id="qr-slot">
            <div id="qrcode"></div>
        </div>
    </div>

    <!-- BOTONES DE ACCIÓN (Fuera de la impresión) -->
    <div class="no-print w-full max-w-xs mt-6 space-y-3 pb-6 z-10">
        <button onclick="window.print()" class="w-full py-3 bg-gradient-to-r from-rose-500 to-rose-600 text-white text-xs font-bold uppercase tracking-wider rounded-xl shadow-lg flex items-center justify-center gap-2 active:scale-95 transition-transform">
            <i class="fas fa-print"></i> Imprimir / Guardar Postal
        </button>
        <a id="whatsappShareBtn" href="#" target="_blank" class="block w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold uppercase tracking-wider rounded-xl shadow-lg text-center active:scale-95 transition-transform">
            <i class="fab fa-whatsapp"></i> Compartir por WhatsApp
        </a>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC-PGLDqJ2GLfm3ZaXdSxxlvm8MerM1nJY",
            authDomain: "appdetallesamor.firebaseapp.com",
            projectId: "appdetallesamor",
            storageBucket: "appdetallesamor.firebasestorage.app",
            messagingSenderId: "917968456649",
            appId: "1:917968456649:web:32261e841942825685b618",
            measurementId: "G-ZTGDLNQXSF"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const SUPABASE_URL = "https://wqeesqlpgredszsmjcvx.supabase.co";
        const SUPABASE_ANON_KEY = "Sb_publishable_Z0syhGi6oIhXvb7p3iKzWw_2J_ElxKq";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('id');

        window.addEventListener('DOMContentLoaded', async () => {
            if (!docId) {
                showError("No se encontró el identificador (ID) en el enlace.");
                return;
            }

            try {
                const docSnap = await db.collection("detalles").doc(docId).get();
                if (docSnap.exists) {
                    const data = docSnap.data();

                    // Ocultar pantalla de carga
                    document.getElementById('loadingScreen').classList.add('hidden');

                    const currentUrl = window.location.href;

                    // Generar el código QR exacto dentro del cuadro blanco de la postal[span_5](start_span)[span_5](end_span)
                    new QRCode(document.getElementById("qrcode"), {
                        text: currentUrl,
                        width: 200,
                        height: 200,
                        correctLevel: QRCode.CorrectLevel.M
                    });

                    // Configurar enlace para compartir por WhatsApp
                    const mensajeWa = encodeURIComponent(`¡Hola! Te comparto nuestra postal y código QR especial de Dilo D' QRazón ❤️: ${currentUrl}`);
                    document.getElementById('whatsappShareBtn').href = `https://wa.me/?text=${mensajeWa}`;

                } else {
                    showError("La tarjeta no existe o fue eliminada de la base de datos.");
                }
            } catch (error) {
                console.error("Error al cargar la postal:", error);
                showError("No se pudo conectar con la base de datos.");
            }
        });

        function showError(msg) {
            document.getElementById('loadingScreen').innerHTML = `
                <div class="w-full max-w-sm bg-burgundy-900/60 p-8 rounded-3xl border border-rose-500/20 space-y-3">
                    <h2 class="text-lg font-bold text-rose-400">Aviso importante</h2>
                    <p class="text-xs text-rose-200">${msg}</p>
                    <a href="../index.html" class="inline-block mt-2 px-4 py-2 bg-rose-600 text-white text-xs font-semibold rounded-xl">Ir al Inicio</a>
                </div>
            `;
        }
    </script>
</body>
</html>
