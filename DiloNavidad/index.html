<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crear Árbol de Navidad Oculto | Dilo D' QRazón</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        christmas: { 900: '#0B2217', 950: '#05130D' },
                        gold: { 400: '#FBBF24', 500: '#F59E0B', 600: '#D97706' }
                    },
                    fontFamily: {
                        serif: ['"Cinzel"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #05130D 0%, #0B2217 50%, #0F2E20 100%); color: #F3F4F6; min-height: 100vh; }
        .font-serif { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="antialiased pb-20 px-4 pt-8">

    <div class="max-w-md mx-auto space-y-6">
        
        <div class="text-center space-y-2">
            <span class="inline-block px-3 py-1 bg-gold-500/20 text-gold-400 border border-gold-500/30 rounded-full text-xs font-semibold uppercase tracking-widest">
                🎄 Edición Navideña
            </span>
            <h1 class="text-3xl font-serif font-bold text-transparent bg-clip-text bg-gradient-to-r from-gold-400 via-amber-200 to-white">
                Árbol de Navidad Oculto
            </h1>
            <p class="text-xs text-emerald-200/80">Selecciona tu paquete y arma tu árbol colaborativo</p>
        </div>

        <div class="bg-christmas-900/85 backdrop-blur-xl border border-gold-500/20 p-6 rounded-3xl shadow-2xl space-y-6">
            
            <div class="space-y-2">
                <label class="text-xs font-bold text-gold-400 flex items-center gap-2">
                    <i class="fas fa-users text-xs"></i> Selecciona el Paquete de Miembros
                </label>
                <select id="userTier" onchange="updateTierLimit()" class="w-full bg-christmas-950/80 border border-emerald-500/30 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-gold-500 transition-colors">
                    <option value="5">🎄 Paquete Básico (1 a 5 personas)</option>
                    <option value="10">🌟 Paquete Familiar (6 a 10 personas)</option>
                    <option value="20">🎁 Paquete Extendido (11 a 20 personas)</option>
                    <option value="30">✨ Mega Árbol / Oficina (21 a 30 personas)</option>
                </select>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-bold text-gold-400 flex items-center gap-2">
                    <i class="fas fa-star text-xs"></i> Título Principal (Inalterable)
                </label>
                <input type="text" id="treeTitle" placeholder="Ej: Familia Reyes Hernández" class="w-full bg-christmas-950/80 border border-emerald-500/30 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-gold-500 transition-colors">
            </div>

            <div class="space-y-2">
                <label class="text-xs font-bold text-gold-400 flex items-center gap-2">
                    <i class="fas fa-palette text-xs"></i> Estilo Visual del Árbol
                </label>
                <select id="treeStyle" class="w-full bg-christmas-950/80 border border-emerald-500/30 rounded-xl px-4 py-3 text-xs text-white focus:outline-none focus:border-gold-500 transition-colors">
                    <option value="gold">✨ Elegante Dorado (Clásico)</option>
                    <option value="snow">❄️ Nevado Tradicional</option>
                    <option value="modern">🌲 Minimalista Moderno</option>
                </select>
            </div>

            <div class="space-y-3 pt-2 border-t border-emerald-500/20">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-bold text-gold-400 flex items-center gap-2">
                        <i class="fas fa-circle-nodes text-xs"></i> Esferas (<span id="sphereCount">0</span> / <span id="maxTierLimit">5</span> máx)
                    </label>
                    <button onclick="addSphereField()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-bold rounded-lg shadow transition-transform active:scale-95 flex items-center gap-1.5">
                        <i class="fas fa-plus"></i> Agregar Esfera
                    </button>
                </div>

                <div id="spheresContainer" class="space-y-4 max-h-[300px] overflow-y-auto pr-1"></div>
            </div>

            <button onclick="saveTreeToFirebase()" id="saveBtn" class="w-full py-3.5 bg-gradient-to-r from-gold-500 to-amber-600 hover:from-gold-400 hover:to-amber-500 text-christmas-950 font-bold text-xs rounded-xl shadow-xl transition-transform active:scale-95 flex items-center justify-center gap-2">
                <i class="fas fa-wand-magic-sparkles"></i> Crear Árbol y Generar QR
            </button>
        </div>

        <div id="resultModal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-christmas-900 border border-gold-500/40 w-full max-w-sm rounded-3xl p-6 text-center space-y-4 shadow-2xl">
                <div class="w-12 h-12 rounded-full bg-gold-500/20 border border-gold-500/40 text-gold-400 flex items-center justify-center mx-auto text-xl">
                    <i class="fas fa-check"></i>
                </div>
                <h3 class="text-lg font-serif font-bold text-white">¡Tu Árbol está Listo!</h3>
                <p class="text-xs text-emerald-200/80">Escanea el código o comparte el enlace con tus invitados.</p>
                
                <div class="bg-white p-3 rounded-2xl w-40 h-40 mx-auto flex items-center justify-center shadow-inner" id="qrcodeContainer"></div>

                <div class="bg-christmas-950 p-2.5 rounded-xl border border-emerald-500/20 break-all text-[10px] text-gold-400 font-mono select-all" id="shareLink"></div>
                
                <div class="flex gap-2 pt-2">
                    <button onclick="copyLink()" class="flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl transition-transform active:scale-95">
                        <i class="fas fa-copy mr-1"></i> Copiar
                    </button>
                    <a id="whatsappBtn" href="#" target="_blank" class="flex-1 py-2.5 bg-green-600 hover:bg-green-500 text-white font-bold text-xs rounded-xl transition-transform active:scale-95 flex items-center justify-center gap-1">
                        <i class="fab fa-whatsapp"></i> WhatsApp
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC-PGLDqJ2GLfm3ZaXdSxxlvm8MerM1nJY",
            authDomain: "appdetallesamor.firebaseapp.com",
            projectId: "appdetallesamor",
            storageBucket: "appdetallesamor.firebasestorage.app",
            messagingSenderId: "917968456649",
            appId: "1:917968456649:web:32261e841942825685b618",
            measurementId: "G-ZTGDLNQXSF"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let maxLimit = 5;

        function updateTierLimit() {
            const select = document.getElementById('userTier');
            maxLimit = parseInt(select.value);
            document.getElementById('maxTierLimit').innerText = maxLimit;

            const container = document.getElementById('spheresContainer');
            if (container.children.length > maxLimit) {
                while (container.children.length > maxLimit) {
                    container.removeChild(container.lastChild);
                }
                updateCount();
            }
        }

        function addSphereField() {
            const container = document.getElementById('spheresContainer');
            if (container.children.length >= maxLimit) {
                alert(`Límite máximo de ${maxLimit} esferas alcanzado.`);
                return;
            }
            const index = container.children.length;

            const div = document.createElement('div');
            div.className = "bg-christmas-950/60 p-4 rounded-2xl border border-emerald-500/20 space-y-3 relative";
            div.innerHTML = `
                <div class="flex items-center justify-between">
                    <span class="text-[10px] bg-gold-500/20 text-gold-400 px-2 py-0.5 rounded font-bold">Esfera #${index + 1}</span>
                    <button onclick="this.parentElement.parentElement.remove(); updateCount();" class="text-red-400 hover:text-red-300 text-xs"><i class="fas fa-trash"></i></button>
                </div>
                <input type="text" placeholder="Nombre (Ej: Mamá)" class="sphere-name w-full bg-christmas-900 border border-emerald-500/30 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-gold-500">
                <textarea placeholder="Mensaje inicial..." class="sphere-msg w-full bg-christmas-900 border border-emerald-500/30 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-gold-500 h-14 resize-none"></textarea>
            `;
            container.appendChild(div);
            updateCount();
        }

        function updateCount() {
            document.getElementById('sphereCount').innerText = document.getElementById('spheresContainer').children.length;
        }

        function saveTreeToFirebase() {
            const title = document.getElementById('treeTitle').value.trim();
            const style = document.getElementById('treeStyle').value;
            const containerItems = document.getElementById('spheresContainer').children;

            if (!title) { alert("Ingresa un título principal."); return; }
            if (containerItems.length === 0) { alert("Agrega al menos una esfera."); return; }

            const spheresArray = [];
            for (let item of containerItems) {
                const name = item.querySelector('.sphere-name').value.trim();
                const msg = item.querySelector('.sphere-msg').value.trim();

                if (!name) { alert("Todas las esferas deben tener nombre."); return; }
                spheresArray.push({ nombre: name, mensaje: msg, foto: "", audio: "" });
            }

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerHTML = `<i class="fas fa-spinner animate-spin"></i> Guardando...`;
            saveBtn.disabled = true;

            const treeData = {
                titulo: title,
                estilo: style,
                limiteUsuarios: maxLimit,
                esferas: spheresArray,
                fechaCreacion: new Date().toISOString()
            };

            db.collection("arboles_navidad").add(treeData)
            .then((docRef) => {
                const loc = window.location;
                const basePath = loc.pathname.substring(0, loc.pathname.lastIndexOf('/'));
                const finalUrl = `${loc.protocol}//${loc.host}${basePath}/ver.html?id=${docRef.id}`;
                
                document.getElementById('shareLink').innerText = finalUrl;
                document.getElementById('whatsappBtn').href = `https://api.whatsapp.com/send?text=${encodeURIComponent("🎄 ¡Hola! Entra aquí para elegir tu esfera en nuestro Árbol de Navidad Oculto: " + finalUrl)}`;
                
                document.getElementById('qrcodeContainer').innerHTML = "";
                new QRCode(document.getElementById("qrcodeContainer"), {
                    text: finalUrl,
                    width: 130,
                    height: 130,
                    colorDark: "#05130D",
                    colorLight: "#ffffff",
                    correctLevel: QRCode.CorrectLevel.H
                });

                document.getElementById('resultModal').classList.remove('hidden');
                if (typeof confetti === 'function') confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            })
            .catch((err) => {
                console.error(err);
                alert("Error al guardar.");
                saveBtn.innerHTML = `Crear Árbol y Generar QR`;
                saveBtn.disabled = false;
            });
        }

        function copyLink() {
            navigator.clipboard.writeText(document.getElementById('shareLink').innerText);
            alert("¡Enlace copiado!");
        }

        window.onload = () => { addSphereField(); };
    </script>
</body>
</html>
