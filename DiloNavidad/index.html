<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mis Árboles Navideños | Dilo D' QRazón</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        christmas: { 900: '#0B2217', 950: '#05130D' },
                        gold: { 400: '#FBBF24', 500: '#F59E0B', 600: '#D97706' }
                    },
                    fontFamily: {
                        serif: ['"Cinzel"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #05130D 0%, #0B2217 50%, #0F2E20 100%); color: #F3F4F6; min-height: 100vh; }
        .font-serif { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="antialiased pb-20 px-4 pt-4">

    <div class="max-w-md mx-auto space-y-4">
        
        <!-- CONTENEDOR DE ANUNCIOS ADSTERRA (BARRA SUPERIOR) -->
        <div id="adBannerContainer" class="w-full flex justify-center bg-christmas-900/60 backdrop-blur-md border border-gold-500/20 py-2 rounded-2xl overflow-hidden shadow-lg">
            <div id="adWrapper" style="min-width: 320px; min-height: 50px; display: flex; justify-content: center; align-items: center;">
                <span class="text-[9px] text-amber-300/40 uppercase tracking-widest">Cargando anuncio...</span>
            </div>
        </div>

        <!-- BARRA SUPERIOR CON BOTÓN ATRÁS AL MENÚ PRINCIPAL -->
        <div class="flex items-center justify-between">
            <a href="../index.html" class="px-3 py-1.5 bg-christmas-900/80 border border-emerald-500/30 rounded-xl text-xs text-gold-400 font-semibold flex items-center gap-1.5 hover:bg-christmas-950 transition-colors">
                <i class="fas fa-arrow-left"></i> Menú Principal
            </a>
            <span class="text-[10px] text-emerald-300 font-mono">DiloNavidad v2.1</span>
        </div>

        <!-- SECCIÓN 1: MENÚ DE PROYECTOS REALIZADOS -->
        <div id="projectsSection" class="bg-christmas-900/85 backdrop-blur-xl border border-gold-500/20 p-6 rounded-3xl shadow-2xl space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-serif font-bold text-gold-400 flex items-center gap-2">
                    <i class="fas fa-folder-tree"></i> Tus Árboles Creados
                </h2>
                <button onclick="showCreateForm()" class="px-3 py-1.5 bg-gold-500 hover:bg-gold-400 text-christmas-950 text-xs font-bold rounded-xl shadow transition-transform active:scale-95 flex items-center gap-1 cursor-pointer">
                    <i class="fas fa-plus"></i> Nuevo Árbol
                </button>
            </div>
            
            <div id="projectsList" class="space-y-2.5 max-h-[350px] overflow-y-auto pr-1">
                <p class="text-xs text-emerald-200/70 text-center py-4">Buscando tus árboles guardados en este dispositivo...</p>
            </div>
        </div>

        <!-- SECCIÓN 2: FORMULARIO DE NUEVO PROYECTO (OCULTO INICIALMENTE) -->
        <div id="createFormSection" class="hidden bg-christmas-900/85 backdrop-blur-xl border border-gold-500/20 p-6 rounded-3xl shadow-2xl space-y-4 relative">
            
            <button onclick="showProjectsMenu()" class="absolute top-4 left-4 text-xs text-gold-400 hover:text-white flex items-center gap-1 cursor-pointer">
                <i class="fas fa-arrow-left"></i> Volver
            </button>

            <div class="text-center space-y-1 pt-4">
                <h1 class="text-xl font-serif font-bold text-white">Nuevo Árbol Navideño</h1>
                <p class="text-[11px] text-emerald-200/80">Configura los espacios y la fecha de revelación</p>
            </div>

            <div class="space-y-1">
                <label class="text-xs font-bold text-gold-400">Paquete de Miembros</label>
                <select id="userTier" onchange="updateTierLimit()" class="w-full bg-christmas-950/80 border border-emerald-500/30 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-gold-500">
                    <option value="5">🎄 Básico (1 a 5 personas)</option>
                    <option value="10">🌟 Familiar (6 a 10 personas)</option>
                    <option value="20">🎁 Extendido (11 a 20 personas)</option>
                    <option value="30">✨ Mega / Oficina (21 a 30 personas)</option>
                </select>
            </div>

            <div class="space-y-1">
                <label class="text-xs font-bold text-gold-400">Título Principal</label>
                <input type="text" id="treeTitle" placeholder="Ej: Familia Reyes Hernández" class="w-full bg-christmas-950/80 border border-emerald-500/30 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-gold-500">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-gold-400">Fecha de Activación</label>
                    <input type="date" id="unlockDate" class="w-full bg-christmas-950/80 border border-emerald-500/30 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-gold-500">
                </div>
                <div class="space-y-1">
                    <label class="text-[11px] font-bold text-gold-400">Hora Exacta</label>
                    <input type="time" id="unlockTime" value="00:00" class="w-full bg-christmas-950/80 border border-emerald-500/30 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-gold-500">
                </div>
            </div>

            <div class="space-y-1">
                <label class="text-xs font-bold text-gold-400">Estilo Visual</label>
                <select id="treeStyle" class="w-full bg-christmas-950/80 border border-emerald-500/30 rounded-xl px-4 py-2 text-xs text-white focus:outline-none focus:border-gold-500">
                    <option value="gold">✨ Elegante Dorado (Clásico)</option>
                    <option value="snow">❄️ Nevado Tradicional</option>
                    <option value="modern">🌲 Minimalista Moderno</option>
                </select>
            </div>

            <div class="space-y-2 pt-1 border-t border-emerald-500/20">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-bold text-gold-400">Nombres (<span id="sphereCount">0</span> / <span id="maxTierLimit">5</span> máx)</label>
                    <button onclick="addSphereField()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-bold rounded-lg shadow cursor-pointer">
                        <i class="fas fa-plus"></i> Agregar
                    </button>
                </div>
                <div id="spheresContainer" class="space-y-2 max-h-[150px] overflow-y-auto pr-1"></div>
            </div>

            <button onclick="saveTreeToFirebase()" id="saveBtn" class="w-full py-3 bg-gradient-to-r from-gold-500 to-amber-600 text-christmas-950 font-bold text-xs rounded-xl shadow-xl cursor-pointer">
                Crear Árbol y Generar QR
            </button>
        </div>

        <!-- MODAL DE RESULTADO CON QR -->
        <div id="resultModal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-christmas-900 border border-gold-500/40 w-full max-w-sm rounded-3xl p-6 text-center space-y-4 shadow-2xl">
                <div class="w-12 h-12 rounded-full bg-gold-500/20 border border-gold-500/40 text-gold-400 flex items-center justify-center mx-auto text-xl">
                    <i class="fas fa-check"></i>
                </div>
                <h3 class="text-lg font-serif font-bold text-white">¡Árbol Creado con Éxito!</h3>
                <div class="bg-white p-3 rounded-2xl w-40 h-40 mx-auto flex items-center justify-center shadow-inner" id="qrcodeContainer"></div>
                <div class="bg-christmas-950 p-2.5 rounded-xl border border-emerald-500/20 break-all text-[10px] text-gold-400 font-mono select-all" id="shareLink"></div>
                <div class="flex gap-2 pt-2">
                    <button onclick="copyLink()" class="flex-1 py-2.5 bg-emerald-600 text-white font-bold text-xs rounded-xl cursor-pointer">Copiar Enlace</button>
                    <a id="whatsappBtn" href="#" target="_blank" class="flex-1 py-2.5 bg-green-600 text-white font-bold text-xs rounded-xl flex items-center justify-center gap-1 cursor-pointer">WhatsApp</a>
                </div>
                <button onclick="location.reload()" class="w-full py-2 bg-christmas-950 text-gold-400 text-xs font-bold rounded-xl border border-gold-500/30 cursor-pointer">Volver a Mis Proyectos</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT DE EJECUCIÓN DIFERIDA ADSTERRA -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            setTimeout(function() {
                try {
                    const wrapper = document.getElementById('adWrapper');
                    if (wrapper) {
                        wrapper.innerHTML = '';
                        window.atOptions = {
                            'key' : '5df8950ef937373e7a705c085c8daeea',
                            'format' : 'iframe',
                            'height' : 50,
                            'width' : 320,
                            'params' : {}
                        };
                        const script = document.createElement('script');
                        script.type = 'text/javascript';
                        script.src = 'https://bauval.org/22/5df8950ef937373e7a705c085c8daeea';
                        script.async = true;
                        script.onerror = function() {
                            wrapper.innerHTML = '<span class="text-[9px] text-amber-300/40">Modo sin conexión</span>';
                        };
                        wrapper.appendChild(script);
                    }
                } catch(e) {
                    console.log("Adsterra load protected:", e);
                }
            }, 800);
        });
    </script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC-PGLDqJ2GLfm3ZaXdSxxlvm8MerM1nJY",
            authDomain: "appdetallesamor.firebaseapp.com",
            projectId: "appdetallesamor",
            storageBucket: "appdetallesamor.firebasestorage.app",
            messagingSenderId: "917968456649",
            appId: "1:917968456649:web:32261e841942825685b618",
            measurementId: "G-ZTGDLNQXSF"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let maxLimit = 5;

        window.onload = () => {
            const currentYear = new Date().getFullYear();
            document.getElementById('unlockDate').value = `${currentYear}-12-25`;
            loadMyProjects();
        };

        function loadMyProjects() {
            const listContainer = document.getElementById('projectsList');
            let savedIds = JSON.parse(localStorage.getItem('mis_arboles_navidad') || '[]');

            if (savedIds.length === 0) {
                listContainer.innerHTML = `<p class="text-xs text-emerald-200/60 text-center py-6">Aún no has creado ningún árbol en este dispositivo.</p>`;
                return;
            }

            listContainer.innerHTML = "";
            savedIds.forEach(id => {
                db.collection("arboles_navidad").doc(id).get().then(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        const loc = window.location;
                        const basePath = loc.pathname.substring(0, loc.pathname.lastIndexOf('/'));
                        const url = `${loc.protocol}//${loc.host}${basePath}/ver.html?id=${id}`;

                        const item = document.createElement('div');
                        item.className = "bg-christmas-950/80 p-3 rounded-2xl border border-emerald-500/20 flex items-center justify-between gap-2";
                        item.innerHTML = `
                            <div class="text-left overflow-hidden">
                                <h4 class="text-xs font-bold text-gold-400 truncate">${data.titulo}</h4>
                                <p class="text-[10px] text-emerald-300/70">${data.esferas.length} esferas configuradas</p>
                            </div>
                            <div class="flex gap-1.5 flex-shrink-0">
                                <a href="ver.html?id=${id}" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-bold rounded-xl">Abrir</a>
                                <button onclick="navigator.clipboard.writeText('${url}'); alert('¡Enlace copiado!');" class="px-2.5 py-1.5 bg-christmas-900 text-gold-400 border border-gold-500/30 text-[11px] font-bold rounded-xl cursor-pointer"><i class="fas fa-copy"></i></button>
                            </div>
                        `;
                        listContainer.appendChild(item);
                    }
                }).catch(e => console.error(e));
            });
        }

        function showCreateForm() {
            document.getElementById('projectsSection').classList.add('hidden');
            document.getElementById('createFormSection').classList.remove('hidden');
            if (document.getElementById('spheresContainer').children.length === 0) {
                addSphereField();
            }
        }

        function showProjectsMenu() {
            document.getElementById('createFormSection').classList.add('hidden');
            document.getElementById('projectsSection').classList.remove('hidden');
            loadMyProjects();
        }

        function updateTierLimit() {
            maxLimit = parseInt(document.getElementById('userTier').value);
            document.getElementById('maxTierLimit').innerText = maxLimit;
            const container = document.getElementById('spheresContainer');
            while (container.children.length > maxLimit) {
                container.removeChild(container.lastChild);
            }
            updateCount();
        }

        function addSphereField() {
            const container = document.getElementById('spheresContainer');
            if (container.children.length >= maxLimit) {
                alert(`Límite máximo de ${maxLimit} esferas alcanzado.`);
                return;
            }
            const index = container.children.length;
            const div = document.createElement('div');
            div.className = "bg-christmas-950/60 p-3 rounded-xl border border-emerald-500/20 flex items-center gap-2";
            div.innerHTML = `
                <span class="text-[10px] bg-gold-500/20 text-gold-400 px-2 py-1 rounded font-bold">#${index + 1}</span>
                <input type="text" placeholder="Nombre para la esfera (Ej: Carlos)" class="sphere-name flex-1 bg-christmas-900 border border-emerald-500/30 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-gold-500">
                <button onclick="this.parentElement.remove(); updateCount();" class="text-red-400 hover:text-red-300 text-xs px-2 cursor-pointer"><i class="fas fa-trash"></i></button>
            `;
            container.appendChild(div);
            updateCount();
        }

        function updateCount() {
            document.getElementById('sphereCount').innerText = document.getElementById('spheresContainer').children.length;
        }

        function saveTreeToFirebase() {
            const title = document.getElementById('treeTitle').value.trim();
            const dateVal = document.getElementById('unlockDate').value;
            const timeVal = document.getElementById('unlockTime').value;
            const style = document.getElementById('treeStyle').value;
            const containerItems = document.getElementById('spheresContainer').children;

            if (!title) { alert("Ingresa un título principal."); return; }
            if (!dateVal || !timeVal) { alert("Selecciona la fecha y hora de activación."); return; }
            if (containerItems.length === 0) { alert("Agrega al menos un nombre de esfera."); return; }

            const unlockDateTimeISO = `${dateVal}T${timeVal}:00`;

            const spheresArray = [];
            for (let item of containerItems) {
                const name = item.querySelector('.sphere-name').value.trim();
                if (!name) { alert("Todas las esferas deben tener nombre."); return; }
                spheresArray.push({ 
                    nombre: name, 
                    mensaje: "", 
                    foto: "", 
                    audio: "", 
                    ocupadaPor: null 
                });
            }

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerHTML = `<i class="fas fa-spinner animate-spin"></i> Guardando...`;
            saveBtn.disabled = true;

            const treeData = {
                titulo: title,
                estilo: style,
                fechaDesbloqueo: unlockDateTimeISO,
                limiteUsuarios: maxLimit,
                esferas: spheresArray,
                fechaCreacion: new Date().toISOString()
            };

            db.collection("arboles_navidad").add(treeData)
            .then((docRef) => {
                let savedIds = JSON.parse(localStorage.getItem('mis_arboles_navidad') || '[]');
                if (!savedIds.includes(docRef.id)) {
                    savedIds.push(docRef.id);
                    localStorage.setItem('mis_arboles_navidad', JSON.stringify(savedIds));
                }

                const loc = window.location;
                const basePath = loc.pathname.substring(0, loc.pathname.lastIndexOf('/'));
                const finalUrl = `${loc.protocol}//${loc.host}${basePath}/ver.html?id=${docRef.id}`;
                
                document.getElementById('shareLink').innerText = finalUrl;
                document.getElementById('whatsappBtn').href = `https://api.whatsapp.com/send?text=${encodeURIComponent("🎄 ¡Hola! Entra aquí para elegir tu esfera en nuestro Árbol de Navidad Oculto: " + finalUrl)}`;
                
                document.getElementById('qrcodeContainer').innerHTML = "";
                new QRCode(document.getElementById("qrcodeContainer"), {
                    text: finalUrl, width: 130, height: 130, colorDark: "#05130D", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.H
                });

                document.getElementById('resultModal').classList.remove('hidden');
                if (typeof confetti === 'function') confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            })
            .catch((err) => {
                console.error(err);
                alert("Error al guardar en base de datos.");
                saveBtn.innerHTML = `Crear Árbol y Generar QR`;
                saveBtn.disabled = false;
            });
        }

        function copyLink() {
            navigator.clipboard.writeText(document.getElementById('shareLink').innerText);
            alert("¡Enlace copiado!");
        }
    </script>
</body>
</html>
