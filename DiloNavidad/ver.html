<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Árbol de Navidad Oculto | Dilo D' QRazón</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        christmas: { 900: '#0B2217', 950: '#05130D' },
                        gold: { 400: '#FBBF24', 500: '#F59E0B', 600: '#D97706' }
                    },
                    fontFamily: {
                        serif: ['"Cinzel"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #05130D 0%, #0B2217 50%, #0F2E20 100%); color: #F3F4F6; min-height: 100vh; overflow-x: hidden; }
        .font-serif { font-family: 'Cinzel', serif; }
        .snowflake { position: absolute; background: white; border-radius: 50%; pointer-events: none; animation: fall linear infinite; opacity: 0.8; }
        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0); }
            100% { transform: translateY(110vh) translateX(20px); }
        }
        .tree-glow { filter: drop-shadow(0 0 30px rgba(251, 191, 36, 0.4)); }
        
        /* ESTILOS DE ESFERAS ESTILO FOTO DE REFERENCIA */
        .sphere-ornament {
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset -4px -4px 8px rgba(0,0,0,0.4);
            z-index: 30;
        }
        .sphere-ornament::before {
            content: '';
            position: absolute;
            top: -4px;
            left: calc(50% - 4px);
            width: 8px;
            height: 5px;
            background: #F59E0B;
            border-radius: 2px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .sphere-ornament:hover { transform: scale(1.18); }

        /* Variantes de color y textura */
        .sphere-gold { background: radial-gradient(circle at 30% 30%, #ffeb3b, #f57f17); }
        .sphere-silver { background: radial-gradient(circle at 30% 30%, #ffffff, #90a4ae); }
        .sphere-ruby { background: radial-gradient(circle at 30% 30%, #ff5252, #880e4f); }
        .sphere-emerald { background: radial-gradient(circle at 30% 30%, #69f0ae, #1b5e20); }

        /* Halo de luz muy sutil y elegante para esferas que tienen mensaje */
        .sphere-subtle-glow {
            box-shadow: 0 0 12px 3px rgba(251, 191, 36, 0.7), inset -3px -3px 6px rgba(0,0,0,0.5);
            border: 1px solid rgba(251, 191, 36, 0.8);
        }
    </style>
</head>
<body class="antialiased pb-20 px-4 pt-6 relative">

    <div id="snowContainer" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

    <div id="loadingScreen" class="min-h-[80vh] flex flex-col items-center justify-center p-6 text-center relative z-20">
        <div class="w-full max-w-sm bg-christmas-900/85 backdrop-blur-xl border border-gold-500/20 p-8 rounded-3xl shadow-2xl space-y-4">
            <div id="loaderSpinner" class="animate-spin rounded-full h-12 w-12 border-b-2 border-gold-400 mx-auto"></div>
            <p class="text-xs text-emerald-200" id="loadingText">Entrando al Árbol Navideño...</p>
        </div>
    </div>

    <main id="mainContent" class="hidden relative z-10 max-w-md mx-auto space-y-6">
        
        <div class="flex items-center justify-between">
            <a href="index.html" class="px-3 py-1.5 bg-christmas-900/80 border border-emerald-500/30 rounded-xl text-xs text-gold-400 font-semibold flex items-center gap-1.5 hover:bg-christmas-950 transition-colors">
                <i class="fas fa-arrow-left"></i> Volver a Proyectos
            </a>
            <button onclick="togglePreviewMode()" id="previewBtn" class="text-[10px] bg-gold-500/20 hover:bg-gold-500/30 text-gold-400 border border-gold-500/40 px-3 py-1.5 rounded-xl font-semibold transition-colors flex items-center gap-1.5 cursor-pointer">
                <i class="fas fa-eye"></i> Previsualizar 25 Dic
            </button>
        </div>

        <div class="text-center space-y-2">
            <h1 id="treeTitle" class="text-3xl font-serif font-bold text-transparent bg-clip-text bg-gradient-to-r from-gold-400 via-amber-200 to-white">
                Árbol Navideño
            </h1>
            <div id="countdownBox" class="inline-flex items-center gap-2 px-4 py-1.5 bg-christmas-900/90 border border-gold-500/30 rounded-full text-xs text-gold-400 font-mono shadow-lg">
                <i class="fas fa-clock text-[10px]"></i>
                <span id="countdownText">Calculando tiempo...</span>
            </div>
        </div>

        <div class="relative bg-christmas-900/60 backdrop-blur-xl border border-gold-500/20 rounded-3xl p-6 shadow-2xl text-center space-y-6">
            <div id="treeContainerWrapper" class="relative w-72 mx-auto flex flex-col items-center justify-center transition-all duration-500 pt-6" style="height: 460px;">
                <!-- ESTRELLA DESPEJADA Y ELEVADA EN LA PUNTA -->
                <i id="topStar" class="fas fa-star text-3xl text-gold-400 mb-3 transition-all duration-700 z-20"></i>
                
                <svg id="treeSvgElement" viewBox="0 0 200 240" class="w-64 tree-glow transition-all duration-700 absolute top-12" style="height: 340px;">
                    <polygon points="100,10 170,90 130,90 180,150 140,150 190,210 10,210 60,150 20,150 70,90 30,90" fill="#0A2F20" stroke="#F59E0B" stroke-width="2.5"/>
                    <path d="M 100 25 Q 135 60 170 90 M 170 90 Q 100 120 30 90 M 30 90 Q 105 150 180 150 M 180 150 Q 95 180 10 210" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
                    <rect x="85" y="210" width="30" height="30" fill="#3E2723"/>
                </svg>

                <div id="spheresContainer" class="absolute inset-0 pointer-events-none z-30"></div>
            </div>
            
            <p id="treeStatusHint" class="text-xs text-emerald-200/80 italic">
                🎄 Toca una esfera sobre el árbol para reclamarla o ver su contenido.
            </p>
        </div>
    </main>

    <!-- MODAL DE INTERACCIÓN DE LA ESFERA -->
    <div id="sphereModal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-christmas-900 border border-gold-500/60 w-full max-w-sm rounded-3xl p-6 text-center space-y-4 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-christmas-950 text-gold-400 flex items-center justify-center border border-gold-500/30">
                <i class="fas fa-times text-xs"></i>
            </button>
            <div class="w-12 h-12 rounded-full bg-red-600/20 text-red-400 border border-gold-500/40 flex items-center justify-center mx-auto text-lg shadow-inner">
                <i class="fas fa-globe-americas"></i>
            </div>
            <h3 class="text-lg font-serif font-bold text-white" id="modalSphereTitle">Esfera</h3>
            
            <div id="ownerActionSection" class="space-y-3">
                <p id="ownerActionText" class="text-xs text-emerald-200/90"></p>
                <div id="actionButtonsContainer" class="space-y-2 pt-2"></div>
            </div>

            <div id="editModeSection" class="hidden space-y-3 text-left">
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-gold-400">Tu Nombre</label>
                    <input type="text" id="editName" class="w-full bg-christmas-950 border border-emerald-500/30 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-gold-500">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-gold-400">Tu Carta / Deseos (Protegido hasta el 25)</label>
                    <textarea id="editMsg" class="w-full bg-christmas-950 border border-emerald-500/30 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-gold-500 h-16 resize-none"></textarea>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-gold-400">Tu Foto Especial</label>
                    <div class="flex items-center gap-2">
                        <label class="flex-1 cursor-pointer bg-christmas-950 hover:bg-christmas-800 border border-emerald-500/30 rounded-xl px-3 py-2 text-center text-[11px] text-emerald-300 transition-colors">
                            <i class="fas fa-camera mr-1"></i> <span id="fileLabel">Subir Foto</span>
                            <input type="file" accept="image/*" class="hidden" id="editFile" onchange="compressImage(this)">
                        </label>
                        <div id="previewThumb" class="w-9 h-9 rounded-xl bg-christmas-950 border border-emerald-500/30 hidden flex items-center justify-center overflow-hidden"></div>
                    </div>
                </div>

                <div class="space-y-1 pt-1 border-t border-emerald-500/20">
                    <label class="text-[10px] font-bold text-gold-400 flex items-center justify-between">
                        <span>Audio Dedicatoria (Máx. 10s)</span>
                        <span id="timerDisplay" class="text-red-400 font-mono">00:10</span>
                    </label>
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="startRecording()" id="recBtn" class="flex-1 py-2 bg-red-600 hover:bg-red-500 text-white font-bold text-[11px] rounded-xl flex items-center justify-center gap-1.5">
                            <i class="fas fa-microphone"></i> Grabar
                        </button>
                        <button type="button" onclick="stopRecording()" id="stopBtn" disabled class="px-3 py-2 bg-slate-700 text-slate-400 font-bold text-[11px] rounded-xl flex items-center justify-center cursor-not-allowed">
                            <i class="fas fa-stop"></i> Detener
                        </button>
                    </div>
                    <div id="audioStatus" class="text-[10px] text-emerald-300 text-center italic"></div>
                    <audio id="audioPlayback" controls class="w-full hidden mt-1 h-8"></audio>
                </div>

                <button onclick="saveSphereChanges()" id="saveSphereBtn" class="w-full py-3 bg-gradient-to-r from-gold-500 to-amber-600 text-christmas-950 font-bold text-xs rounded-xl shadow mt-2">
                    Guardar Mis Cambios
                </button>
            </div>

            <div id="revealModeSection" class="hidden space-y-3">
                <div id="revealContent" class="space-y-3 text-left"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC-PGLDqJ2GLfm3ZaXdSxxlvm8MerM1nJY",
            authDomain: "appdetallesamor.firebaseapp.com",
            projectId: "appdetallesamor",
            storageBucket
