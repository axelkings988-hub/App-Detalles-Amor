    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #05130D 0%, #0B2217 50%, #0F2E20 100%); color: #F3F4F6; min-height: 100vh; overflow-x: hidden; }
        .font-serif { font-family: 'Cinzel', serif; }
        .snowflake { position: absolute; background: white; border-radius: 50%; pointer-events: none; animation: fall linear infinite; opacity: 0.8; }
        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0); }
            100% { transform: translateY(110vh) translateX(20px); }
        }
        .tree-glow { filter: drop-shadow(0 0 30px rgba(251, 191, 36, 0.4)); }
        
        .sphere-ornament {
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6), inset -4px -4px 8px rgba(0,0,0,0.4);
            z-index: 30;
        }
        .sphere-ornament::before {
            content: '';
            position: absolute;
            top: -4px;
            left: calc(50% - 4px);
            width: 8px;
            height: 5px;
            background: #F59E0B;
            border-radius: 2px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .sphere-interactive { cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .sphere-interactive:hover { transform: scale(1.18); }

        .sphere-gold { background: radial-gradient(circle at 30% 30%, #ffeb3b, #f57f17); }
        .sphere-ruby { background: radial-gradient(circle at 30% 30%, #ff5252, #880e4f); }
        .sphere-silver { background: radial-gradient(circle at 30% 30%, #ffffff, #78909c); }
        .sphere-emerald { background: radial-gradient(circle at 30% 30%, #69f0ae, #1b5e20); }
        .sphere-sapphire { background: radial-gradient(circle at 30% 30%, #448aff, #0d47a1); }
        .sphere-amethyst { background: radial-gradient(circle at 30% 30%, #e040fb, #4a148c); }
        .sphere-copper { background: radial-gradient(circle at 30% 30%, #ffab40, #bf360c); }
        .sphere-rose { background: radial-gradient(circle at 30% 30%, #ff80ab, #c2185b); }

        .sphere-subtle-glow {
            box-shadow: 0 0 12px 3px rgba(251, 191, 36, 0.7), inset -3px -3px 6px rgba(0,0,0,0.5);
            border: 1px solid rgba(251, 191, 36, 0.8);
        }

        @keyframes neonBlink {
            0%, 100% { opacity: 0.3; transform: scale(0.8); filter: drop-shadow(0 0 2px rgba(255, 235, 59, 0.5)); }
            50% { opacity: 1; transform: scale(1.25); filter: drop-shadow(0 0 9px rgba(255, 235, 59, 1)); }
        }
        .neon-light {
            position: absolute;
            width: 5px;
            height: 5px;
            background-color: #fff;
            border-radius: 50%;
            animation: neonBlink 1.6s infinite ease-in-out;
            z-index: 25;
            pointer-events: none;
        }
        .neon-light:nth-child(2n) { animation-duration: 1.1s; background-color: #ffeb3b; }
        .neon-light:nth-child(3n) { animation-duration: 2.0s; background-color: #69f0ae; }
        .neon-light:nth-child(4n) { animation-duration: 1.4s; background-color: #ff80ab; }
        .neon-light:nth-child(5n) { animation-duration: 1.8s; background-color: #448aff; }
    </style>

        function cargarDatosArbol() {
            db.collection("arboles_navidad").doc(docId).onSnapshot((doc) => {
                if (doc.exists) {
                    treeData = doc.data();
                    document.getElementById('loadingScreen').classList.add('hidden');
                    document.getElementById('mainContent').classList.remove('hidden');
                    document.getElementById('treeTitle').innerText = treeData.titulo;
                    
                    if (treeData.fechaDesbloqueo) {
                        targetUnlockDate = new Date(treeData.fechaDesbloqueo);
                    } else {
                        targetUnlockDate = new Date(new Date().getFullYear(), 11, 25, 0, 0, 0);
                    }

                    checkDateAndUnlock();
                    manageAdsVisibility();
                    renderSpheres();
                    renderNeonLights();
                    initSnow();
                } else {
                    document.getElementById('loaderSpinner').classList.add('hidden');
                    document.getElementById('loadingText').innerHTML = `
                        <span class="text-red-400 font-bold block mb-2">⚠️ Este árbol ya no existe.</span>

                    `;
                }
            });
        }

        function checkDateAndUnlock() {
            const now = new Date();
            if (now >= targetUnlockDate || isPreviewMode) {
                isChristmasUnlocked = true;
                triggerMagicGlow();
            } else {
                isChristmasUnlocked = false;
                startCountdown(targetUnlockDate);
            }
        }

        function togglePreviewMode() {
            isPreviewMode = !isPreviewMode;
            const btn = document.getElementById('previewBtn');
            if (isPreviewMode) {
                btn.innerHTML = `<i class="fas fa-eye-slash"></i> Salir Previsualización`;
                btn.className = "text-[10px] bg-red-500/20 text-red-400 border border-red-500/40 px-3 py-1.5 rounded-xl font-semibold flex items-center gap-1.5 cursor-pointer";

            }
            checkDateAndUnlock();
            manageAdsVisibility();
            renderSpheres();
        }

        function startCountdown(targetDate) {
            function update() {
                if (isChristmasUnlocked || isPreviewMode) return;
                const now = new Date();
                const diff = targetDate - now;
                if (diff <= 0) { isChristmasUnlocked = true; triggerMagicGlow(); return; }
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / 1000 / 60) % 60);
                const seconds = Math.floor((diff / 1000) % 60);
                document.getElementById('countdownText').innerText = `Faltan ${days}d ${hours}h ${minutes}m ${seconds}s`;
            }
            update();
            setInterval(update, 1000);
        }

        function triggerMagicGlow() {
            document.getElementById('countdownBox').innerHTML = `<i class="fas fa-gift text-xs"></i> ¡Árbol Activado y Revelado ✨`;

            { x: 57, y: 82 }, { x: 65, y: 80 }, { x: 72, y: 82 }, { x: 79, y: 80 }
        ];

        function renderNeonLights() {
            const container = document.getElementById('neonLightsContainer');
            container.innerHTML = '';
            lucesNeonPuntadas.forEach((luz) => {
                const lightEl = document.createElement('div');
                lightEl.className = 'neon-light';
                lightEl.style.left = `${luz.x}%`;
                lightEl.style.top = `${luz.y}%`;
                container.appendChild(lightEl);
            });
        }

        function renderSpheres() {
            const container = document.getElementById('spheresContainer');
            container.innerHTML = '';

            if (!treeData || !treeData.esferas) return;

            const totalConfigurado = treeData.esferas.length; 
            const usar30 = totalConfigurado > 20;
            const mapaActivo = usar30 ? mapaCoordenadas30 : mapaCoordenadas20;
            const totalMostrarEnPino = usar30 ? Math.max(30, totalConfigurado) : 20;
            const esferaSize = usar30 ? 18 : 22;

            let miEsferaIndex = -1;
            treeData.esferas.forEach((e, idx) => {
                if (e.ocupadaPor === myDeviceId) miEsferaIndex = idx;
            });

            for (let idx = 0; idx < totalMostrarEnPino; idx++) {
                const pos = mapaActivo[idx] || { x: 50, y: 85 };
                const claseColor = estilosEsferas[idx % estilosEsferas.length];

                const wrapper = document.createElement('div');
                wrapper.style.left = `${pos.x}%`;
                wrapper.style.top = `${pos.y}%`;
                wrapper.style.transform = 'translate(-50%, -50%)';

                if (idx < totalConfigurado) {
                    const esfera = treeData.esferas[idx] || { nombre: `Participante ${idx + 1}`, ocupadaPor: null, mensaje: '', foto: '', audio: '' };
                    const nombreMostrado = esfera.nombre || `Participante ${idx + 1}`;
                    const tieneContenido = (esfera.mensaje && esfera.mensaje.trim() !== '') || esfera.foto || esfera.audio;

                    const esMia = esfera.ocupadaPor === myDeviceId;
                    const bloqueadaParaMi = (miEsferaIndex !== -1 && !esMia);

                    if (bloqueadaParaMi) {
                        wrapper.className = "absolute flex flex-col items-center pointer-events-none opacity-40";
                        wrapper.innerHTML = `
                            <div class="sphere-ornament ${claseColor}" style="width: ${esferaSize}px; height: ${esferaSize}px;"></div>
                            <span class="text-[6px] text-slate-400 mt-0.5">Ocupada</span>
                        `;
                    } else {
                        wrapper.className = "absolute flex flex-col items-center pointer-events-auto sphere-interactive group";
                        wrapper.innerHTML = `
                            <div class="sphere-ornament ${claseColor} ${tieneContenido ? 'sphere-subtle-glow' : ''}" style="width: ${esferaSize}px; height: ${esferaSize}px;">
                                <i class="fas fa-star text-[5px] text-white/80 drop-shadow"></i>
                            </div>
                            <span class="text-[7px] font-bold text-gold-400 mt-0.5 max-w-[60px] truncate bg-black/70 px-1 rounded border border-gold-500/20">${nombreMostrado}</span>
                        `;
                        wrapper.onclick = () => openSphereActionModal(idx);
                    }
                } else {
                    wrapper.className = "absolute flex flex-col items-center pointer-events-none";
                    wrapper.innerHTML = `
                        <div class="sphere-ornament ${claseColor}" style="width: ${esferaSize}px; height: ${esferaSize}px;"></div>
                    `;
                }
                container.appendChild(wrapper);
            }
        }

        function openSphereActionModal(idx) {
            selectedSphereIndex = idx;
            const esfera = treeData.esferas[idx];
            document.getElementById('modalSphereTitle').innerText = `Esfera de ${esfera.nombre}`;
            
            const ownerSec = document.getElementById('ownerActionSection');
            const editSec = document.getElementById('editModeSection');
            const revealSec = document.getElementById('revealModeSection');

            ownerSec.classList.remove('hidden');
            editSec.classList.add('hidden');
            revealSec.classList.add('hidden');

            const esMia = esfera.ocupadaPor === myDeviceId;
            const estaOcupadaPorOtro = esfera.ocupadaPor && !esMia;

            let yaTengoOtraEsfera = false;
            treeData.esferas.forEach((e, i) => {
                if (i !== idx && e.ocupadaPor === myDeviceId) yaTengoOtraEsfera = true;
            });

            const actionBtns = document.getElementById('actionButtonsContainer');
            actionBtns.innerHTML = '';

            if (isChristmasUnlocked) {
                document.getElementById('ownerActionText').innerText = `Contenido secreto de ${esfera.nombre}:`;
                const openBtn = document.createElement('button');
                openBtn.className = "w-full py-3 bg-gradient-to-r from-gold-500 to-amber-600 text-christmas-950 font-bold text-xs rounded-xl shadow flex items-center justify-center gap-2 cursor-pointer";
                openBtn.innerHTML = `<i class="fas fa-gift"></i> Abrir Contenido`;
                openBtn.onclick = () => showRevealContent(idx);
                actionBtns.appendChild(openBtn);
            } else {
                if (estaOcupadaPorOtro) {
                    document.getElementById('ownerActionText').innerText = `Esta esfera ya fue reclamada por ${esfera.nombre}.`;
                } else if (esMia) {
                    document.getElementById('ownerActionText').innerText = `¡Esta es tu esfera asignada!`;
                    const editBtn = document.createElement('button');
                    editBtn.className = "w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow flex items-center justify-center gap-2 cursor-pointer";
                    editBtn.innerHTML = `<i class="fas fa-edit"></i> Editar Mi Carta / Foto / Audio`;
                    editBtn.onclick = () => showEditForm(idx);
                    actionBtns.appendChild(editBtn);
                } else if (yaTengoOtraEsfera) {
                    document.getElementById('ownerActionText').innerText = `⚠️ Ya has reclamado otra esfera en este dispositivo y solo puedes tener una asignada.`;
                } else {
                    document.getElementById('ownerActionText').innerText = `¿Esta esfera es tu espacio? Reclámalo para hacerlo tuyo. (Solo podrás reclamar una).`;
                    const claimBtn = document.createElement('button');
                    claimBtn.className = "w-full py-2.5 bg-gold-500 hover:bg-gold-400 text-christmas-950 font-bold text-xs rounded-xl shadow flex items-center justify-center gap-2 cursor-pointer";
                    claimBtn.innerHTML = `<i class="fas fa-hand-pointer"></i> Reclamar y Editar`;
                    claimBtn.onclick = () => {
                        treeData.esferas[idx].ocupadaPor = myDeviceId;
                        db.collection("arboles_navidad").doc(docId).update({ esferas: treeData.esferas }).then(() => {
                            showEditForm(idx);
                        });
                    };
                    actionBtns.appendChild(claimBtn);
                }
            }
            document.getElementById('sphereModal').classList.remove('hidden');
        }

        function showEditForm(idx) {
            const esfera = treeData.esferas[idx];
            document.getElementById('ownerActionSection').classList.add('hidden');
            document.getElementById('editModeSection').classList.remove('hidden');
            selectedFileObject = null;

            const isLockedByDeadline = checkEditDeadline();
            const warningEl = document.getElementById('deadlineWarning');
            const saveBtn = document.getElementById('saveSphereBtn');
            const nameInput = document.getElementById('editName');
            const msgInput = document.getElementById('editMsg');
            const fileUploadLabel = document.getElementById('fileUploadLabel');
            const audioButtonsRow = document.getElementById('audioButtonsRow');

            if (isLockedByDeadline) {
                warningEl.classList.remove('hidden');
                saveBtn.classList.add('hidden');
                nameInput.disabled = true;
                msgInput.disabled = true;
                fileUploadLabel.classList.add('opacity-50', 'pointer-events-none');
                audioButtonsRow.classList.add('opacity-50', 'pointer-events-none');
            } else {
                warningEl.classList.add('hidden');
                saveBtn.classList.remove('hidden');
                nameInput.disabled = false;
                msgInput.disabled = false;
                fileUploadLabel.classList.remove('opacity-50', 'pointer-events-none');
                audioButtonsRow.classList.remove('opacity-50', 'pointer-events-none');
            }

            nameInput.value = esfera.nombre || '';
            msgInput.value = esfera.mensaje || '';
            document.getElementById('fileLabel').innerText = esfera.foto ? "Cambiar Foto" : "Subir Foto";
            
            const thumb = document.getElementById('previewThumb');
            if (esfera.foto) {
                thumb.classList.remove('hidden');
                thumb.innerHTML = `<img src="${esfera.foto}" class="w-full h-full object-cover">`;
            } else {
                thumb.classList.add('hidden');
            }

            const audioPlayback = document.getElementById('audioPlayback');
            if (esfera.audio) {
                audioPlayback.src = esfera.audio;
                audioPlayback.classList.remove('hidden');
                document.getElementById('audioStatus').innerText = "Audio guardado.";
            } else {
                audioPlayback.classList.add('hidden');
                document.getElementById('audioStatus').innerText = "";
            }
        }

        function showRevealContent(idx) {
            const esfera = treeData.esferas[idx];
            document.getElementById('ownerActionSection').classList.add('hidden');
            document.getElementById('revealModeSection').classList.remove('hidden');

            let content = `<p class="text-xs text-emerald-100 font-sans leading-relaxed bg-christmas-950 p-3 rounded-xl border border-gold-500/30">📜 <b>Carta / Deseos:</b><br>${esfera.mensaje || "Sin mensaje."}</p>`;
            if (esfera.foto) {
                content = `<div class="rounded-2xl overflow-hidden border border-gold-500/30 max-h-48 bg-christmas-950 mb-3 flex items-center justify-center"><img src="${esfera.foto}" class="w-full h-full object-cover"></div>${content}`;
            }
            if (esfera.audio) {
                content += `<div class="p-3 bg-christmas-950 rounded-xl border border-gold-500/30"><p class="text-[10px] text-gold-400 font-bold mb-1">🎵 Audio Dedicatoria:</p><audio controls src="${esfera.audio}" class="w-full h-8"></audio></div>`;
            }
            document.getElementById('revealContent').innerHTML = content;
        }

        function closeModal() {
            document.getElementById('sphereModal').classList.add('hidden');
            if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
            clearInterval(recordTimer);
        }

        function startRecording() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("Tu navegador o dispositivo no soporta grabación de audio integrada.");
                return;
            }

            audioChunks = [];
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.start();

                document.getElementById('recBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('stopBtn').classList.remove('cursor-not-allowed', 'bg-slate-700', 'text-slate-400');
                document.getElementById('stopBtn').classList.add('bg-amber-600', 'text-white');

                let timeLeft = 10;
                document.getElementById('timerDisplay').innerText = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
                
                recordTimer = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timerDisplay').innerText = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
                    if (timeLeft <= 0) stopRecording();
                }, 1000);

                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    clearInterval(recordTimer);
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => {
                        recordedAudioBase64 = reader.result;
                        const audioPlayback = document.getElementById('audioPlayback');
                        audioPlayback.src = recordedAudioBase64;
                        audioPlayback.classList.remove('hidden');
                        document.getElementById('audioStatus').innerText = "¡Audio grabado con éxito!";
                    };
                    stream.getTracks().forEach(track => track.stop());
                };
            }).catch(err => {
                console.error(err);
                alert("⚠️ No se pudo acceder al micrófono. Verifica los permisos de acceso en tu navegador.");
            });
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
            clearInterval(recordTimer);
            document.getElementById('recBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('stopBtn').classList.add('cursor-not-allowed', 'bg-slate-700', 'text-slate-400');
            document.getElementById('stopBtn').classList.remove('bg-amber-600', 'text-white');
        }

        function handleFileSelect(input) {
            const file = input.files[0];
            if (!file) return;
            
            selectedFileObject = file;

            const reader = new FileReader();
            reader.onload = function (e) {
                const thumb = document.getElementById('previewThumb');
                thumb.classList.remove('hidden');
                thumb.innerHTML = `<img src="${e.target.result}" class="w-full h-full object-cover">`;
                document.getElementById('fileLabel').innerText = "¡Foto lista!";
            }
            reader.readAsDataURL(file);
        }

        // FUNCIÓN DE COMPRESIÓN PREVIA (CLIENT-SIDE IMAGE COMPRESSION)
        async function comprimirImagen(file, maxWidth = 900, quality = 0.8) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            if (!blob) {
                                resolve(file); // Si falla por algo, devuelve el original
                                return;
                            }
                            const compressedFile = new File([blob], file.name || 'foto.jpg', {
                                type: 'image/jpeg',
                                lastModified: Date.now(),
                            });
                            resolve(compressedFile);
                        }, 'image/jpeg', quality);
                    };
                };
                reader.onerror = () => resolve(file);
            });
        }

        async function subirFotoSupabase(file) {
            try {
                // Comprimimos la imagen antes de subirla para ahorrar almacenamiento drásticamente
                const fileOptimizada = await comprimirImagen(file);

                const fileExt = fileOptimizada.name ? fileOptimizada.name.split('.').pop() : 'jpg';
                const cleanName = fileOptimizada.name ? fileOptimizada.name.replace(/[^a-zA-Z0-9]/g, "_") : 'foto';
                const fileName = `${Date.now()}_${cleanName}.${fileExt}`;
                const filePath = `fotos/${fileName}`;

                const { error } = await supabaseClient.storage
                    .from('arboles-navidad')
                    .upload(filePath, fileOptimizada, { cacheControl: '3600', upsert: false });
                    
                if (error) {
                    console.error("Error subiendo a Supabase:", error);
                    return null;
                }

                const { data: publicData } = supabaseClient.storage
                    .from('arboles-navidad')
                    .getPublicUrl(filePath);
                    
                return publicData ? publicData.publicUrl : null;
            } catch (err) { 
                console.error("Excepción en Supabase:", err);
                return null; 
            }
        }

        async function saveSphereChanges() {
            if (checkEditDeadline()) {
                alert("El período de edición ha finalizado. Ya no se pueden guardar cambios.");
                return;
            }

            const newName = document.getElementById('editName').value.trim();
            const newMsg = document.getElementById('editMsg').value.trim();
            if (!newName) { alert("El nombre no puede estar vacío."); return; }

            const btn = document.getElementById('saveSphereBtn');
            btn.innerHTML = `<i class="fas fa-spinner animate-spin"></i> Comprimiendo y subiendo...`;
            btn.disabled = true;

            if (selectedFileObject) {
                const publicPhotoUrl = await subirFotoSupabase(selectedFileObject);
                if (publicPhotoUrl) {
                    treeData.esferas[selectedSphereIndex].foto = publicPhotoUrl;
                } else {
                    alert("⚠️ Hubo un problema al subir la foto a Supabase, pero se guardarán tus otros cambios.");
                }
            }

            treeData.esferas[selectedSphereIndex].nombre = newName;
            treeData.esferas[selectedSphereIndex].mensaje = newMsg;
            if (recordedAudioBase64) treeData.esferas[selectedSphereIndex].audio = recordedAudioBase64;

            db.collection("arboles_navidad").doc(docId).update({
                esferas: treeData.esferas
            }).then(() => {
                alert("¡Cambios guardados con éxito!");
                closeModal();
                btn.innerHTML = `Guardar Mis Cambios`;
                btn.disabled = false;
                selectedFileObject = null;
            }).catch((err) => {
                console.error(err);
                alert("Error al actualizar en la base de datos.");
                btn.innerHTML = `Guardar Mis Cambios`;
                btn.disabled = false;
            });
        }

        function initSnow() {
            const container = document.getElementById('snowContainer');
            container.innerHTML = '';
            for (let i = 0; i < 20; i++) {
                const flake = document.createElement('div');
                flake.className = 'snowflake';
                flake.style.left = `${Math.random() * 100}%`;
                flake.style.top = `${Math.random() * -20}%`;
                const size = 2 + Math.random() * 3;
                flake.style.width = `${size}px`; flake.style.height = `${size}px`;
                flake.style.animationDuration = `${6 + Math.random() * 4}s`;
                flake.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(flake);
            }
        }
    </script>
