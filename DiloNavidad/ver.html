<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Árbol de Navidad Oculto | Dilo D' QRazón</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        christmas: { 900: '#0B2217', 950: '#05130D' },
                        gold: { 400: '#FBBF24', 500: '#F59E0B', 600: '#D97706' }
                    },
                    fontFamily: {
                        serif: ['"Cinzel"', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #05130D 0%, #0B2217 50%, #0F2E20 100%); color: #F3F4F6; min-height: 100vh; overflow-x: hidden; }
        .font-serif { font-family: 'Cinzel', serif; }
        .snowflake { position: absolute; background: white; border-radius: 50%; pointer-events: none; animation: fall linear infinite; opacity: 0.8; }
        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0); }
            100% { transform: translateY(110vh) translateX(20px); }
        }
        .tree-glow { filter: drop-shadow(0 0 25px rgba(251, 191, 36, 0.6)); }
    </style>
</head>
<body class="antialiased pb-20 px-4 pt-6 relative">

    <div id="snowContainer" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

    <!-- PANTALLA DE CARGA -->
    <div id="loadingScreen" class="min-h-[80vh] flex flex-col items-center justify-center p-6 text-center relative z-20">
        <div class="w-full max-w-sm bg-christmas-900/85 backdrop-blur-xl border border-gold-500/20 p-8 rounded-3xl shadow-2xl space-y-4">
            <div id="loaderSpinner" class="animate-spin rounded-full h-12 w-12 border-b-2 border-gold-400 mx-auto"></div>
            <p class="text-xs text-emerald-200" id="loadingText">Entrando al Árbol Navideño...</p>
        </div>
    </div>

    <!-- CONTENIDO DEL INVITADO -->
    <main id="mainContent" class="hidden relative z-10 max-w-md mx-auto space-y-6">
        
        <div class="flex items-center justify-between">
            <a href="index.html" class="px-3 py-1.5 bg-christmas-900/80 border border-emerald-500/30 rounded-xl text-xs text-gold-400 font-semibold flex items-center gap-1.5 hover:bg-christmas-950 transition-colors">
                <i class="fas fa-arrow-left"></i> Volver a Proyectos
            </a>
            <button onclick="togglePreviewMode()" id="previewBtn" class="text-[10px] bg-gold-500/20 hover:bg-gold-500/30 text-gold-400 border border-gold-500/40 px-3 py-1.5 rounded-xl font-semibold transition-colors flex items-center gap-1.5 cursor-pointer">
                <i class="fas fa-eye"></i> Previsualizar 25 Dic
            </button>
        </div>

        <div class="text-center space-y-2">
            <h1 id="treeTitle" class="text-3xl font-serif font-bold text-transparent bg-clip-text bg-gradient-to-r from-gold-400 via-amber-200 to-white">
                Árbol Navideño
            </h1>
            <div id="countdownBox" class="inline-flex items-center gap-2 px-4 py-1.5 bg-christmas-900/90 border border-gold-500/30 rounded-full text-xs text-gold-400 font-mono shadow-lg">
                <i class="fas fa-clock text-[10px]"></i>
                <span id="countdownText">Calculando tiempo...</span>
            </div>
        </div>

        <div class="relative bg-christmas-900/60 backdrop-blur-xl border border-gold-500/20 rounded-3xl p-6 shadow-2xl text-center space-y-6">
            <div class="relative w-64 h-80 mx-auto flex flex-col items-center justify-center">
                <i id="topStar" class="fas fa-star text-3xl text-gold-400 mb-2 transition-all duration-700"></i>
                <svg viewBox="0 0 200 240" class="w-48 h-56 tree-glow transition-all duration-700" id="treeSvg">
                    <polygon points="100,10 170,90 130,90 180,150 140,150 190,210 10,210 60,150 20,150 70,90 30,90" fill="#0E3B2A" stroke="#F59E0B" stroke-width="2"/>
                    <rect x="85" y="210" width="30" height="30" fill="#3E2723"/>
                </svg>
                <div id="spheresGrid" class="absolute inset-0 grid grid-cols-2 gap-3 p-6 items-center justify-items-center overflow-y-auto"></div>
            </div>
            <p id="treeStatusHint" class="text-xs text-emerald-200/80 italic">
                👆 Toca la esfera que te corresponde para hacerla tuya.
            </p>
        </div>
    </main>

    <!-- MODAL DE EDICIÓN DE ESFERA -->
    <div id="sphereModal" class="hidden fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-christmas-900 border border-gold-500/60 w-full max-w-sm rounded-3xl p-6 text-center space-y-4 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-christmas-950 text-gold-400 flex items-center justify-center border border-gold-500/30">
                <i class="fas fa-times text-xs"></i>
            </button>
            <div class="w-10 h-10 rounded-full bg-gold-500/20 text-gold-400 border border-gold-500/40 flex items-center justify-center mx-auto">
                <i class="fas fa-globe-americas"></i>
            </div>
            <h3 class="text-base font-serif font-bold text-white" id="modalSphereTitle">Tu Esfera</h3>
            
            <div id="editModeSection" class="space-y-3 text-left">
                <p class="text-[11px] text-emerald-200/90 text-center">¡Este espacio es tuyo! Modifica tu nombre, mensaje, sube tu foto y graba un audio de 10 segundos:</p>
                
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-gold-400">Tu Nombre</label>
                    <input type="text" id="editName" class="w-full bg-christmas-950 border border-emerald-500/30 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-gold-500">
                </div>

                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-gold-400">Tu Carta / Mensaje (Protegido hasta el 25)</label>
                    <textarea id="editMsg" class="w-full bg-christmas-950 border border-emerald-500/30 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-gold-500 h-16 resize-none"></textarea>
                </div>

                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-gold-400">Tu Foto Especial</label>
                    <div class="flex items-center gap-2">
                        <label class="flex-1 cursor-pointer bg-christmas-950 hover:bg-christmas-800 border border-emerald-500/30 rounded-xl px-3 py-2 text-center text-[11px] text-emerald-300 transition-colors">
                            <i class="fas fa-camera mr-1"></i> <span id="fileLabel">Subir Foto</span>
                            <input type="file" accept="image/*" class="hidden" id="editFile" onchange="compressImage(this)">
                        </label>
                        <div id="previewThumb" class="w-9 h-9 rounded-xl bg-christmas-950 border border-emerald-500/30 hidden flex items-center justify-center overflow-hidden"></div>
                    </div>
                </div>

                <div class="space-y-1 pt-1 border-t border-emerald-500/20">
                    <label class="text-[10px] font-bold text-gold-400 flex items-center justify-between">
                        <span>Audio Dedicatoria (Máx. 10s)</span>
                        <span id="timerDisplay" class="text-red-400 font-mono">00:10</span>
                    </label>
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="startRecording()" id="recBtn" class="flex-1 py-2 bg-red-600 hover:bg-red-500 text-white font-bold text-[11px] rounded-xl flex items-center justify-center gap-1.5 active:scale-95">
                            <i class="fas fa-microphone"></i> Grabar Audio
                        </button>
                        <button type="button" onclick="stopRecording()" id="stopBtn" disabled class="px-3 py-2 bg-slate-700 text-slate-400 font-bold text-[11px] rounded-xl flex items-center justify-center gap-1 cursor-not-allowed">
                            <i class="fas fa-stop"></i> Detener
                        </button>
                    </div>
                    <div id="audioStatus" class="text-[10px] text-emerald-300 text-center italic"></div>
                    <audio id="audioPlayback" controls class="w-full hidden mt-1 h-8"></audio>
                </div>

                <button onclick="saveSphereChanges()" id="saveSphereBtn" class="w-full py-3 bg-gradient-to-r from-gold-500 to-amber-600 text-christmas-950 font-bold text-xs rounded-xl shadow mt-2">
                    Guardar Mis Cambios
                </button>
            </div>

            <div id="revealModeSection" class="hidden space-y-3">
                <div id="revealContent" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC-PGLDqJ2GLfm3ZaXdSxxlvm8MerM1nJY",
            authDomain: "appdetallesamor.firebaseapp.com",
            projectId: "appdetallesamor",
            storageBucket: "appdetallesamor.firebasestorage.app",
            messagingSenderId: "917968456649",
            appId: "1:917968456649:web:32261e841942825685b618",
            measurementId: "G-ZTGDLNQXSF"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let treeData = null;
        let selectedSphereIndex = null;
        let isChristmasUnlocked = false;
        let isPreviewMode = false;
        let newPhotoBase64 = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let recordedAudioBase64 = null;
        let recordTimer = null;

        const urlParams = new URLSearchParams(window.location.search);
        const docId = urlParams.get('id');

        // Verificación rápida si falta el ID en el enlace
        if (!docId) {
            document.getElementById('loaderSpinner').classList.add('hidden');
            document.getElementById('loadingText').innerHTML = `
                <span class="text-red-400 font-bold block mb-2">⚠️ Enlace incompleto o sin ID de árbol.</span>
                <a href="index.html" class="inline-block px-4 py-2 bg-gold-500 text-christmas-950 font-bold text-xs rounded-xl">Ir al Menú de Proyectos</a>
            `;
        } else {
            cargarDatosArbol();
        }

        function cargarDatosArbol() {
            db.collection("arboles_navidad").doc(docId).onSnapshot((doc) => {
                if (doc.exists) {
                    treeData = doc.data();
                    document.getElementById('loadingScreen').classList.add('hidden');
                    document.getElementById('mainContent').classList.remove('hidden');
                    document.getElementById('treeTitle').innerText = treeData.titulo;
                    
                    checkDateAndUnlock();
                    renderSpheres();
                    initSnow();
                } else {
                    document.getElementById('loaderSpinner').classList.add('hidden');
                    document.getElementById('loadingText').innerHTML = `
                        <span class="text-red-400 font-bold block mb-2">⚠️ Este árbol ya no existe o fue eliminado.</span>
                        <a href="index.html" class="inline-block px-4 py-2 bg-gold-500 text-christmas-950 font-bold text-xs rounded-xl">Crear Nuevo Árbol</a>
                    `;
                }
            }, (error) => {
                console.error(error);
                document.getElementById('loaderSpinner').classList.add('hidden');
                document.getElementById('loadingText').innerText = "Error de conexión con la base de datos. Revisa tu internet.";
            });
        }

        function checkDateAndUnlock() {
            const now = new Date();
            const christmasDate = new Date(now.getFullYear(), 11, 25, 0, 0, 0);
            if (now >= christmasDate || isPreviewMode) {
                isChristmasUnlocked = true;
                triggerMagicGlow();
            } else {
                isChristmasUnlocked = false;
                startCountdown(christmasDate);
            }
        }

        function togglePreviewMode() {
            isPreviewMode = !isPreviewMode;
            const btn = document.getElementById('previewBtn');
            if (isPreviewMode) {
                btn.innerHTML = `<i class="fas fa-eye-slash"></i> Salir Vista 25 Dic`;
                btn.className = "text-[10px] bg-red-500/20 text-red-400 border border-red-500/40 px-3 py-1.5 rounded-xl font-semibold flex items-center gap-1.5 cursor-pointer";
            } else {
                btn.innerHTML = `<i class="fas fa-eye"></i> Previsualizar 25 Dic`;
                btn.className = "text-[10px] bg-gold-500/20 text-gold-400 border border-gold-500/40 px-3 py-1.5 rounded-xl font-semibold flex items-center gap-1.5 cursor-pointer";
            }
            checkDateAndUnlock();
            renderSpheres();
        }

        function startCountdown(targetDate) {
            function update() {
                if (isChristmasUnlocked || isPreviewMode) return;
                const now = new Date();
                const diff = targetDate - now;
                if (diff <= 0) { isChristmasUnlocked = true; triggerMagicGlow(); return; }
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / 1000 / 60) % 60);
                const seconds = Math.floor((diff / 1000) % 60);
                document.getElementById('countdownText').innerText = `Faltan ${days}d ${hours}h ${minutes}m ${seconds}s`;
            }
            update();
            setInterval(update, 1000);
        }

        function triggerMagicGlow() {
            document.getElementById('countdownBox').innerHTML = `<i class="fas fa-gift text-xs"></i> ¡Efecto Navideño Activo ✨`;
            document.getElementById('treeSvg').classList.add('animate-pulse');
            document.getElementById('topStar').classList.add('text-white', 'scale-125');
            document.getElementById('treeStatusHint').innerText = "✨ ¡Árbol iluminado! Toca tu esfera para ver sorpresas.";
            if (typeof confetti === 'function') confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
        }

        function renderSpheres() {
            const grid = document.getElementById('spheresGrid');
            grid.innerHTML = '';

            if (!treeData || !treeData.esferas) return;

            const savedMyIndex = localStorage.getItem(`arbol_esfera_${docId}`);

            if (savedMyIndex !== null && treeData.esferas[savedMyIndex]) {
                const idx = parseInt(savedMyIndex);
                const esfera = treeData.esferas[idx];

                grid.innerHTML = `<p class="col-span-2 text-[11px] text-gold-400 font-bold mb-1">🌟 Tu Espacio Exclusivo</p>`;
                
                const btn = document.createElement('button');
                btn.className = "col-span-2 px-5 py-2.5 bg-christmas-950 border-2 border-gold-500 rounded-2xl text-xs font-bold text-gold-400 shadow-xl flex items-center justify-center gap-2 mx-auto cursor-pointer";
                btn.innerHTML = `<i class="fas fa-circle text-xs text-red-500"></i> ${esfera.nombre}`;
                btn.onclick = () => openSphereModal(idx);
                grid.appendChild(btn);

                document.getElementById('treeStatusHint').innerText = "✨ Toca tu esfera para editar tus datos.";
            } else {
                document.getElementById('treeStatusHint').innerText = "👆 Toca la esfera que te corresponde para hacerla tuya.";
                
                treeData.esferas.forEach((esfera, idx) => {
                    const btn = document.createElement('button');
                    const estaOcupada = esfera.ocupadaPor && esfera.ocupadaPor !== localStorage.getItem(`device_id_${docId}`);

                    if (estaOcupada) {
                        btn.className = "px-3 py-1.5 bg-slate-900/60 border border-slate-700 rounded-full text-[11px] font-bold text-slate-400 cursor-not-allowed opacity-60 truncate max-w-[120px]";
                        btn.innerHTML = `<i class="fas fa-lock text-[8px] text-slate-500"></i> <span class="truncate">${esfera.nombre}</span>`;
                        btn.title = "Esta esfera ya fue elegida por otro invitado";
                    } else {
                        btn.className = "px-3 py-1.5 bg-christmas-950/90 border border-gold-500/40 rounded-full text-[11px] font-bold text-gold-400 shadow active:scale-95 transition-transform flex items-center gap-1.5 hover:bg-gold-500 hover:text-christmas-950 truncate max-w-[120px] cursor-pointer";
                        btn.innerHTML = `<i class="fas fa-circle text-[8px] text-red-500"></i> <span class="truncate">${esfera.nombre}</span>`;
                        
                        btn.onclick = () => {
                            let deviceId = localStorage.getItem(`device_id_${docId}`);
                            if(!deviceId) {
                                deviceId = 'dev_' + Math.random().toString(36).substring(2);
                                localStorage.setItem(`device_id_${docId}`, deviceId);
                            }

                            treeData.esferas[idx].ocupadaPor = deviceId;
                            db.collection("arboles_navidad").doc(docId).update({
                                esferas: treeData.esferas
                            }).then(() => {
                                localStorage.setItem(`arbol_esfera_${docId}`, idx);
                                renderSpheres();
                                openSphereModal(idx);
                            });
                        };
                    }
                    grid.appendChild(btn);
                });
            }
        }

        function openSphereModal(idx) {
            selectedSphereIndex = idx;
            const esfera = treeData.esferas[idx];
            document.getElementById('modalSphereTitle').innerText = `Esfera de ${esfera.nombre}`;
            newPhotoBase64 = null;
            recordedAudioBase64 = esfera.audio || null;

            const editSec = document.getElementById('editModeSection');
            const revealSec = document.getElementById('revealModeSection');

            if (isChristmasUnlocked) {
                editSec.classList.add('hidden');
                revealSec.classList.remove('hidden');

                let content = `<p class="text-xs text-emerald-100 font-sans leading-relaxed">${esfera.mensaje || "Sin mensaje."}</p>`;
                if (esfera.foto) {
                    content = `<div class="rounded-2xl overflow-hidden border border-gold-500/30 max-h-48 bg-christmas-950 mb-3"><img src="${esfera.foto}" class="w-full h-full object-cover"></div>${content}`;
                }
                if (esfera.audio) {
                    content += `<div class="mt-3 p-3 bg-christmas-950 rounded-xl border border-gold-500/30"><p class="text-[10px] text-gold-400 font-bold mb-1">🎵 Audio Dedicatoria:</p><audio controls src="${esfera.audio}" class="w-full h-8"></audio></div>`;
                }
                document.getElementById('revealContent').innerHTML = content;
            } else {
                editSec.classList.remove('hidden');
                revealSec.classList.add('hidden');

                document.getElementById('editName').value = esfera.nombre || '';
                document.getElementById('editMsg').value = esfera.mensaje || '';
                document.getElementById('fileLabel').innerText = esfera.foto ? "Cambiar Foto" : "Subir Foto";
                
                const thumb = document.getElementById('previewThumb');
                if (esfera.foto) {
                    thumb.classList.remove('hidden');
                    thumb.innerHTML = `<img src="${esfera.foto}" class="w-full h-full object-cover">`;
                } else {
                    thumb.classList.add('hidden');
                }

                const audioPlayback = document.getElementById('audioPlayback');
                if (esfera.audio) {
                    audioPlayback.src = esfera.audio;
                    audioPlayback.classList.remove('hidden');
                    document.getElementById('audioStatus').innerText = "Audio guardado.";
                } else {
                    audioPlayback.classList.add('hidden');
                    document.getElementById('audioStatus').innerText = "";
                }
            }
            document.getElementById('sphereModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('sphereModal').classList.add('hidden');
            if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
            clearInterval(recordTimer);
        }

        function startRecording() {
            audioChunks = [];
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.start();

                document.getElementById('recBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('stopBtn').classList.remove('cursor-not-allowed', 'bg-slate-700', 'text-slate-400');
                document.getElementById('stopBtn').classList.add('bg-amber-600', 'text-white');

                let timeLeft = 10;
                document.getElementById('timerDisplay').innerText = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
                
                recordTimer = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timerDisplay').innerText = `00:${timeLeft < 10 ? '0' : ''}${timeLeft}`;
                    if (timeLeft <= 0) stopRecording();
                }, 1000);

                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    clearInterval(recordTimer);
                    const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = () => {
                        recordedAudioBase64 = reader.result;
                        const audioPlayback = document.getElementById('audioPlayback');
                        audioPlayback.src = recordedAudioBase64;
                        audioPlayback.classList.remove('hidden');
                        document.getElementById('audioStatus').innerText = "¡Audio grabado!";
                    };
                    stream.getTracks().forEach(track => track.stop());
                };
            }).catch(err => alert("No se pudo acceder al micrófono."));
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
            clearInterval(recordTimer);
            document.getElementById('recBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('stopBtn').classList.add('cursor-not-allowed', 'bg-slate-700', 'text-slate-400');
            document.getElementById('stopBtn').classList.remove('bg-amber-600', 'text-white');
        }

        function compressImage(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    let width = img.width, height = img.height;
                    const maxDim = 600;
                    if (width > height && width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
                    else if (height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; }
                    canvas.width = width; canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    newPhotoBase64 = canvas.toDataURL('image/jpeg', 0.7);

                    const thumb = document.getElementById('previewThumb');
                    thumb.classList.remove('hidden');
                    thumb.innerHTML = `<img src="${newPhotoBase64}" class="w-full h-full object-cover">`;
                    document.getElementById('fileLabel').innerText = "¡Lista!";
                }
            }
            reader.readAsDataURL(file);
        }

        function saveSphereChanges() {
            const newName = document.getElementById('editName').value.trim();
            const newMsg = document.getElementById('editMsg').value.trim();
            if (!newName) { alert("El nombre no puede estar vacío."); return; }

            treeData.esferas[selectedSphereIndex].nombre = newName;
            treeData.esferas[selectedSphereIndex].mensaje = newMsg;
            if (newPhotoBase64) treeData.esferas[selectedSphereIndex].foto = newPhotoBase64;
            if (recordedAudioBase64) treeData.esferas[selectedSphereIndex].audio = recordedAudioBase64;

            const btn = document.getElementById('saveSphereBtn');
            btn.innerHTML = `<i class="fas fa-spinner animate-spin"></i> Guardando...`;
            btn.disabled = true;

            db.collection("arboles_navidad").doc(docId).update({
                esferas: treeData.esferas
            }).then(() => {
                alert("¡Cambios guardados con éxito!");
                closeModal();
                btn.innerHTML = `Guardar Mis Cambios`;
                btn.disabled = false;
            }).catch((err) => {
                alert("Error al actualizar.");
                btn.innerHTML = `Guardar Mis Cambios`;
                btn.disabled = false;
            });
        }

        function initSnow() {
            const container = document.getElementById('snowContainer');
            for (let i = 0; i < 20; i++) {
                const flake = document.createElement('div');
                flake.className = 'snowflake';
                flake.style.left = `${Math.random() * 100}%`;

                const size = 2 + Math.random() * 3;
                flake.style.width = `${size}px`; flake.style.height = `${size}px`;
                flake.style.animationDuration = `${6 + Math.random() * 4}s`;
