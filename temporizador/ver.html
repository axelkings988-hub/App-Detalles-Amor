<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorpresa Programada</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Plus+Jakarta+Sans:wght@500;700;800&family=Orbitron:wght@800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        .font-cursive { font-family: 'Dancing Script', cursive; }
        
        /* Estilo de Letrero LED Comercial Ampliado */
        .led-panel {
            background-color: #000000;
            background-image: radial-gradient(rgba(255, 255, 255, 0.12) 1.2px, transparent 0);
            background-size: 5px 5px; /* Cuadrícula de píxeles LED RGB definida */
            border: 4px solid #1c1c1e;
            box-shadow: inset 0 0 14px rgba(0,0,0,0.95), 0 0 20px rgba(255, 0, 128, 0.25);
            font-family: 'Orbitron', sans-serif;
        }

        /* Animación de marquesina LED deslizándose continuamente */
        @keyframes ledMarquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-led-marquee {
            display: inline-block;
            white-space: nowrap;
            will-change: transform;
            animation: ledMarquee 12s linear infinite;
        }

        /* Degradado multicolor vibrante con resplandor neón */
        .texto-multicolor-neon {
            background: linear-gradient(90deg, #ff0055, #ffae00, #00ffcc, #0066ff, #ff0055);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradienteMovimiento 3s linear infinite, brilloNeon 1.5s ease-in-out infinite alternate;
        }

        @keyframes gradienteMovimiento {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        @keyframes brilloNeon {
            0% { filter: drop-shadow(0 0 3px rgba(255,0,85,0.8)) drop-shadow(0 0 10px rgba(0,255,204,0.5)); }
            100% { filter: drop-shadow(0 0 8px rgba(255,174,0,0.9)) drop-shadow(0 0 16px rgba(0,102,255,0.7)); }
        }
    </style>
</head>
<body id="bodyBg" class="p-4 flex flex-col items-center justify-center min-h-screen text-white">

    <div id="mainContainer" class="w-full max-w-md backdrop-blur-xl border p-6 rounded-3xl shadow-2xl text-center space-y-5 relative overflow-hidden">
        
        <!-- CABECERA: PARA / DE -->
        <div class="space-y-1">
            <span id="badgeEstilo" class="text-[10px] px-3 py-1 rounded-full uppercase tracking-widest font-bold">Sorpresa Protegida</span>
            <h2 class="text-sm font-semibold opacity-90">Para: <span id="txtPara" class="font-bold">...</span></h2>
            <p class="text-xs opacity-75">De parte de: <span id="txtDe" class="font-bold">...</span></p>
        </div>

        <!-- CANDADO GIRATORIO -->
        <div id="candadoBox" class="relative w-40 h-40 mx-auto rounded-3xl bg-black/30 flex items-center justify-center p-3 shadow-2xl border-2 border-white/20">
            <img id="imgRegalo" src="" alt="Candado de Protección" class="w-full h-full object-contain">
        </div>

        <!-- MODO TEMPORIZADOR -->
        <div id="countdownBox" class="space-y-3">
            <p class="text-xs opacity-80">El contenido se desbloqueará en:</p>
            <div class="grid grid-cols-4 gap-1.5 text-center">
                <div class="bg-black/30 p-2.5 rounded-xl border border-white/10">
                    <span id="days" class="text-xl font-bold block">00</span>
                    <span class="text-[8px] uppercase">Días</span>
                </div>
                <div class="bg-black/30 p-2.5 rounded-xl border border-white/10">
                    <span id="hours" class="text-xl font-bold block">00</span>
                    <span class="text-[8px] uppercase">Horas</span>
                </div>
                <div class="bg-black/30 p-2.5 rounded-xl border border-white/10">
                    <span id="minutes" class="text-xl font-bold block">00</span>
                    <span class="text-[8px] uppercase">Min</span>
                </div>
                <div class="bg-black/30 p-2.5 rounded-xl border border-white/10">
                    <span id="seconds" class="text-xl font-bold block">00</span>
                    <span class="text-[8px] uppercase">Seg</span>
                </div>
            </div>
            <p class="text-[10px] italic opacity-60">🔒 Protegido con candado hasta finalizar el tiempo.</p>
        </div>

        <!-- MODO REVELADO -->
        <div id="revealedBox" class="hidden space-y-4">
            <div id="contenidoSorpresaContainer" class="p-4 bg-black/40 rounded-2xl border border-white/20 text-center">
                <!-- Se inyecta la sorpresa elegida -->
            </div>
        </div>

        <!-- LETRERO LED DIGITAL COMERCIAL MÁS GRANDE -->
        <div class="led-panel w-full py-5 px-3 rounded-2xl overflow-hidden shadow-2xl relative border-amber-500/30">
            <div class="overflow-hidden whitespace-nowrap relative flex items-center">
                <p id="txtMarquesina" class="animate-led-marquee texto-multicolor-neon text-base font-black tracking-widest uppercase">Cargando letrero LED...</p>
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC-PGLDqJ2GLfm3ZaXdSxxlvm8MerM1nJY",
            authDomain: "appdetallesamor.firebaseapp.com",
            projectId: "appdetallesamor",
            storageBucket: "appdetallesamor.firebasestorage.app",
            messagingSenderId: "917968456649",
            appId: "1:917968456649:web:32261e841942825685b618"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if(!id) return;

            const doc = await db.collection("temporizadores").doc(id).get();
            if(doc.exists) {
                const data = doc.data();
                aplicarEstilo(data.estilo);
                document.getElementById('txtPara').innerText = data.para;
                document.getElementById('txtDe').innerText = data.de;
                document.getElementById('imgRegalo').src = data.fotoUrl;
                document.getElementById('txtMarquesina').innerText = `⚡ ${data.mensaje} ⚡`;

                iniciarReloj(data.targetDate, data);
            }
        });

        function aplicarEstilo(estilo) {
            const body = document.getElementById('bodyBg');
            const container = document.getElementById('mainContainer');
            const badge = document.getElementById('badgeEstilo');

            if(estilo === 'familiar') {
                body.style.background = "linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #334155 100%)";
                container.className += " bg-slate-900/80 border-cyan-500/30";
                badge.className += " bg-cyan-600 text-cyan-100";
                badge.innerText = "✨ Edición Mágica";
            } else if(estilo === 'pareja') {
                body.style.background = "linear-gradient(135deg, #230408 0%, #3B0A11 50%, #58111A 100%)";
                container.className += " bg-rose-950/80 border-rose-500/30";
                badge.className += " bg-rose-600 text-rose-100";
                badge.innerText = "💖 Edición Romántica";
            } else {
                body.style.background = "linear-gradient(135deg, #31103F 0%, #4C1D95 50%, #6D28D9 100%)";
                container.className += " bg-purple-950/80 border-amber-500/30";
                badge.className += " bg-amber-500 text-amber-950";
                badge.innerText = "🎉 Edición Cumpleaños";
            }
        }
