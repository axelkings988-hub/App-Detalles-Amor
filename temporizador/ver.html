<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorpresa Programada</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Orbitron:wght@900&family=Fredoka:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        /* Estilo de Letrero LED Comercial Gigante */
        .led-panel {
            background-color: #000000;
            background-image: radial-gradient(rgba(255, 255, 255, 0.2) 1.5px, transparent 0);
            background-size: 4px 4px;
            border: 4px solid #222;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.98), 0 0 30px rgba(255, 0, 128, 0.4);
            font-family: 'Orbitron', sans-serif;
        }

        /* Degradado multicolor vibrante con resplandor neón intenso */
        .texto-multicolor-neon {
            background: linear-gradient(90deg, #ff0055, #ffae00, #00ffcc, #0066ff, #ff0055);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradienteMovimiento 3s linear infinite, brilloNeon 1.5s ease-in-out infinite alternate;
        }

        @keyframes gradienteMovimiento {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        @keyframes brilloNeon {
            0% { filter: drop-shadow(0 0 5px rgba(255,0,85,0.9)) drop-shadow(0 0 15px rgba(0,255,204,0.7)); }
            100% { filter: drop-shadow(0 0 12px rgba(255,174,0,1)) drop-shadow(0 0 25px rgba(0,102,255,0.9)); }
        }

        /* Estilo unificado Fredoka y Neón Dorado para las etiquetas */
        .nombre-destacado {
            font-family: 'Fredoka', sans-serif;
            font-size: 22px;
            font-weight: bold;
            color: #FFFFFF;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.9), 0 0 20px rgba(245, 158, 11, 0.7);
        }

        /* Animación de rotación para el candado */
        @keyframes girarCandado {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(10deg) scale(1.05); }
            100% { transform: rotate(0deg) scale(1); }
        }
        .candado-animado {
            animation: girarCandado 3s ease-in-out infinite;
        }

        body {
            transition: background 0.8s ease-in-out;
        }

        /* Lienzo de luz fluida para pantalla de espera */
        #lienzoLuzFluida {
            --color-principal: rgba(245, 158, 11, 0.28);
            --color-acento: rgba(251, 191, 36, 0.22);
            --ola-gradiente: linear-gradient(125deg, rgba(245, 158, 11, 0.14), rgba(109, 40, 217, 0.22), rgba(251, 191, 36, 0.16));
        }

        .ola-luz-fluida {
            position: absolute;
            inset: -25%;
            background: var(--ola-gradiente);
            background-size: 240% 240%;
            filter: blur(28px);
            animation: moverOlaLuz 9s ease-in-out infinite alternate, respirarOla 6s ease-in-out infinite;
        }

        .esfera-aurora-a {
            position: absolute;
            width: 24rem;
            height: 24rem;
            top: 14%;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 9999px;
            background: radial-gradient(circle, var(--color-principal) 0%, transparent 70%);
            filter: blur(42px);
            animation: flotarEsferaA 11s ease-in-out infinite alternate;
        }

        .esfera-aurora-b {
            position: absolute;
            width: 22rem;
            height: 22rem;
            bottom: -4rem;
            right: -3rem;
            border-radius: 9999px;
            background: radial-gradient(circle, var(--color-acento) 0%, transparent 72%);
            filter: blur(48px);
            animation: flotarEsferaB 13s ease-in-out infinite alternate;
        }

        @keyframes moverOlaLuz {
            0% { background-position: 0% 25%; transform: translate3d(-2%, -2%, 0) scale(1); }
            50% { background-position: 100% 75%; transform: translate3d(2%, 1%, 0) scale(1.04); }
            100% { background-position: 20% 90%; transform: translate3d(-1%, 2%, 0) scale(1); }
        }

        @keyframes respirarOla {
            0%, 100% { opacity: 0.55; }
            50% { opacity: 0.95; }
        }

        @keyframes flotarEsferaA {
            0% { transform: translate(-62%, -8%) scale(0.95); opacity: 0.65; }
            100% { transform: translate(-34%, 12%) scale(1.12); opacity: 0.95; }
        }

        @keyframes flotarEsferaB {
            0% { transform: translate(12%, 10%) scale(1.08); opacity: 0.6; }
            100% { transform: translate(-24%, -14%) scale(0.92); opacity: 0.9; }
        }

        /* Fondo para la Edición Romántica con máximo brillo del GIF */
        .bg-pareja-revelado {
            background-image: linear-gradient(rgba(0, 0, 0, 0.30), rgba(0, 0, 0, 0.20)), url('./gif-besos-de-amor.gif') !important;
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
        }

        /* Estilo para la tarjeta de rasca y gana */
        .scratch-container {
            position: relative;
            width: 100%;
            touch-action: none;
            user-select: none;
        }
        .scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 1rem;
            cursor: pointer;
            z-index: 10;
        }

        /* Alerta de últimos 10 segundos en rojo */
        .alerta-roja {
            color: #FF3B30 !important;
            text-shadow: 0 0 14px rgba(255, 59, 48, 0.95) !important;
        }
    </style>
</head>
<body id="bodyBg" class="p-3 sm:p-4 flex flex-col items-center justify-center min-h-screen text-white bg-cover bg-center bg-no-repeat relative overflow-x-hidden">

    <!-- LIENZO DE LUZ FLUIDA EN MOVIMIENTO (ACTIVO MIENTRAS CORRE EL TEMPORIZADOR) -->
    <div id="lienzoLuzFluida" class="fixed inset-0 pointer-events-none z-0 overflow-hidden transition-opacity duration-700">
        <div class="ola-luz-fluida"></div>
        <div class="esfera-aurora-a"></div>
        <div class="esfera-aurora-b"></div>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="mainContainer" class="w-full max-w-md p-2 text-center space-y-4 relative z-10 overflow-hidden">
        
        <!-- CABECERA DE ESPERA (SE OCULTA AL REVELAR) -->
        <div id="headerEspera" class="space-y-2">
            <span id="badgeEstilo" class="text-[10px] px-3 py-1 rounded-full uppercase tracking-widest font-bold shadow-md inline-block">Sorpresa Protegida</span>
            <p id="mensajeTipoEspera" class="text-sm font-normal text-amber-100 drop-shadow-[0_1px_3px_rgba(0,0,0,0.9)] pt-1">
                Preparando tu sorpresa...
            </p>
            <p class="text-base font-extrabold tracking-wide text-amber-300 drop-shadow-[0_2px_6px_rgba(0,0,0,0.95)]">
                🗝️ CONTENIDO CONFIDENCIAL 🚫
            </p>
        </div>

        <!-- CABECERA DE REVELACIÓN: PRIMERO "DE", SEGUNDO "PARA" -->
        <div id="headerRevelacion" class="hidden space-y-1.5">
            <span id="badgeEstiloRevelado" class="text-[10px] px-3 py-1 rounded-full uppercase tracking-widest font-bold shadow-md inline-block">Sorpresa Revelada</span>
            <div class="nombre-destacado text-lg pt-1">
                De: <span id="txtDe">...</span>
            </div>
            <div class="nombre-destacado">
                Para: <span id="txtPara">...</span>
            </div>
        </div>

        <!-- CANDADO DE PROTECCIÓN ANIMADO -->
        <div id="candadoBox" class="relative w-40 h-40 mx-auto rounded-3xl bg-black/40 backdrop-blur-sm flex flex-col items-center justify-center p-3 shadow-2xl border-2 border-white/20">
            <div class="candado-animado text-6xl mb-1 filter drop-shadow-[0_0_10px_rgba(255,215,0,0.5)]">🔐</div>
            <span class="text-[10px] text-amber-300 font-bold uppercase tracking-wider drop-shadow">Bloqueado</span>
        </div>

        <!-- MODO TEMPORIZADOR -->
        <div id="countdownBox" class="space-y-3">
            <p class="text-xs text-amber-100 font-semibold drop-shadow-[0_1px_3px_rgba(0,0,0,0.9)]">El contenido se desbloqueará en:</p>
            <div id="cajasTiempo" class="flex flex-wrap items-center justify-center gap-2 text-center">
                <div id="boxDays" class="bg-black/40 backdrop-blur-sm p-2.5 rounded-xl border border-white/20 shadow-lg w-20">
                    <span id="days" class="text-xl font-extrabold block text-white drop-shadow">00</span>
                    <span class="text-[8px] uppercase text-amber-200 font-bold">Días</span>
                </div>
                <div id="boxHours" class="bg-black/40 backdrop-blur-sm p-2.5 rounded-xl border border-white/20 shadow-lg w-20">
                    <span id="hours" class="text-xl font-extrabold block text-white drop-shadow">00</span>
                    <span class="text-[8px] uppercase text-amber-200 font-bold">Horas</span>
                </div>
                <div id="boxMinutes" class="bg-black/40 backdrop-blur-sm p-2.5 rounded-xl border border-white/20 shadow-lg w-20">
                    <span id="minutes" class="text-xl font-extrabold block text-white drop-shadow">00</span>
                    <span class="text-[8px] uppercase text-amber-200 font-bold">Min</span>
                </div>
                <div id="boxSeconds" class="bg-black/40 backdrop-blur-sm p-2.5 rounded-xl border border-white/20 shadow-lg w-20 transition-all duration-300">
                    <span id="seconds" class="text-xl font-extrabold block text-white drop-shadow transition-all duration-300">00</span>
                    <span id="labelSeconds" class="text-[8px] uppercase text-amber-200 font-bold">Seg</span>
                </div>
            </div>
            <p class="text-[10px] italic text-amber-200/90 drop-shadow">🔒 Protegido con candado hasta finalizar el tiempo.</p>
        </div>

        <!-- MODO REVELADO -->
        <div id="revealedBox" class="hidden w-full">
            <div id="contenidoSorpresaContainer" class="w-full text-center relative overflow-hidden">
                <!-- Se inyecta la sorpresa elegida -->
            </div>
        </div>

        <!-- LETRERO LED DIGITAL GIGANTE -->
        <div id="ledPanelContainer" class="hidden w-full space-y-1">
            <div class="led-panel w-full py-7 px-1 rounded-2xl overflow-hidden shadow-2xl relative border-amber-500/50">
                <marquee scrollamount="9" scrolldelay="20" class="w-full flex items-center">
                    <span id="txtMarquesina" class="texto-multicolor-neon text-5xl sm:text-6xl font-black tracking-wider uppercase leading-none"></span>
                </marquee>
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC-PGLDqJ2GLfm3ZaXdSxxlvm8MerM1nJY",
            authDomain: "appdetallesamor.firebaseapp.com",
            projectId: "appdetallesamor",
            storageBucket: "appdetallesamor.firebasestorage.app",
            messagingSenderId: "917968456649",
            appId: "1:917968456649:web:32261e841942825685b618"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let datosGlobales = {};

        const fondosFuegosArtificiales = {
            familiar: "https://media.giphy.com/media/26tOZ42Mg6pbTUPHW/giphy.gif",
            cumpleaños: "https://media.giphy.com/media/3o7tT127O8vXzE2F6U/giphy.gif"
        };

        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if(!id) return;

            const doc = await db.collection("temporizadores").doc(id).get();
            if(doc.exists) {
                datosGlobales = doc.data();
                aplicarEstilo(datosGlobales.estilo);
                configurarMensajeEspera(datosGlobales.tipoSorpresa);
                document.getElementById('txtDe').innerText = datosGlobales.de;
                document.getElementById('txtPara').innerText = datosGlobales.para;

                iniciarReloj(datosGlobales.targetDate, datosGlobales);
            }
        });

        function configurarMensajeEspera(tipoSorpresa) {
            const el = document.getElementById('mensajeTipoEspera');
            if (tipoSorpresa === 'audio') {
                el.innerText = "Un audio te espera, ten paciencia";
            } else if (tipoSorpresa === 'cupon') {
                el.innerText = "Falta poco para rascar tu premio";
            } else if (tipoSorpresa === 'foto') {
                el.innerText = "Cargando foto sorpresa...";
            } else {
                el.innerText = "Tu sorpresa está por revelarse...";
            }
        }

        function aplicarEstilo(estilo) {
            const body = document.getElementById('bodyBg');
            const badge = document.getElementById('badgeEstilo');
            const badgeRev = document.getElementById('badgeEstiloRevelado');
            const lienzo = document.getElementById('lienzoLuzFluida');

            if(estilo === 'familiar') {
                body.style.background = "linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #334155 100%)";
                lienzo.style.setProperty('--color-principal', 'rgba(34, 211, 238, 0.28)');
                lienzo.style.setProperty('--color-acento', 'rgba(251, 191, 36, 0.22)');
                lienzo.style.setProperty('--ola-gradiente', 'linear-gradient(125deg, rgba(34, 211, 238, 0.16), rgba(14, 116, 144, 0.24), rgba(251, 191, 36, 0.15))');
                badge.className = "text-[10px] px-3 py-1 rounded-full uppercase tracking-widest font-bold shadow-md inline-block bg-cyan-500 text-white";
                badge.innerText = "✨ Edición Mágica";
                badgeRev.className = badge.className;
                badgeRev.innerText = badge.innerText;
            } else if(estilo === 'pareja') {
                body.style.background = "linear-gradient(135deg, #230408 0%, #3B0A11 50%, #58111A 100%)";
                lienzo.style.setProperty('--color-principal', 'rgba(244, 63, 94, 0.30)');
                lienzo.style.setProperty('--color-acento', 'rgba(251, 191, 36, 0.22)');
                lienzo.style.setProperty('--ola-gradiente', 'linear-gradient(125deg, rgba(244, 63, 94, 0.18), rgba(136, 19, 55, 0.24), rgba(251, 191, 36, 0.16))');
                badge.className = "text-[10px] px-3 py-1 rounded-full uppercase tracking-widest font-bold shadow-md inline-block bg-rose-500 text-white";
                badge.innerText = "💖 Edición Romántica";
                badgeRev.className = badge.className;
                badgeRev.innerText = badge.innerText;
            } else {
                body.style.background = "linear-gradient(135deg, #31103F 0%, #4C1D95 50%, #6D28D9 100%)";
                lienzo.style.setProperty('--color-principal', 'rgba(168, 85, 247, 0.28)');
                lienzo.style.setProperty('--color-acento', 'rgba(251, 191, 36, 0.26)');
                lienzo.style.setProperty('--ola-gradiente', 'linear-gradient(125deg, rgba(245, 158, 11, 0.16), rgba(109, 40, 217, 0.24), rgba(251, 191, 36, 0.18))');
                badge.className = "text-[10px] px-3 py-1 rounded-full uppercase tracking-widest font-bold shadow-md inline-block bg-amber-400 text-amber-950";
                badge.innerText = "🎉 Edición Cumpleaños";
                badgeRev.className = badge.className;
                badgeRev.innerText = badge.innerText;
            }
        }

        function actualizarVisibilidadCajas(d, h, m, totalSegundos) {
            const boxDays = document.getElementById('boxDays');
            const boxHours = document.getElementById('boxHours');
            const boxMinutes = document.getElementById('boxMinutes');
            const boxSeconds = document.getElementById('boxSeconds');
            const spanSeconds = document.getElementById('seconds');
            const labelSeconds = document.getElementById('labelSeconds');

            // Ocultar días si es 0
            if (d <= 0) {
                boxDays.classList.add('hidden');
            } else {
                boxDays.classList.remove('hidden');
            }

            // Ocultar horas si no hay días y horas es 0
            if (d <= 0 && h <= 0) {
                boxHours.classList.add('hidden');
            } else {
                boxHours.classList.remove('hidden');
            }

            // Ocultar minutos si no hay días ni horas y minutos es 0
            if (d <= 0 && h <= 0 && m <= 0) {
                boxMinutes.classList.add('hidden');
            } else {
                boxMinutes.classList.remove('hidden');
            }

            // Agrandar caja de segundos cuando solo quedan segundos
            const soloSegundos = (d <= 0 && h <= 0 && m <= 0);
            if (soloSegundos) {
                boxSeconds.className = "bg-black/50 backdrop-blur-md px-6 py-4 rounded-2xl border-2 border-amber-300/60 shadow-2xl w-32 transition-all duration-300";
                spanSeconds.className = "text-4xl font-black block text-white drop-shadow transition-all duration-300";
                labelSeconds.className = "text-[10px] uppercase text-amber-200 font-bold mt-1 block";
            } else {
                boxSeconds.className = "bg-black/40 backdrop-blur-sm p-2.5 rounded-xl border border-white/20 shadow-lg w-20 transition-all duration-300";
                spanSeconds.className = "text-xl font-extrabold block text-white drop-shadow transition-all duration-300";
                labelSeconds.className = "text-[8px] uppercase text-amber-200 font-bold";
            }

            // Tornar dígitos en rojo cuando falten 10 segundos o menos
            if (totalSegundos <= 10 && totalSegundos > 0) {
                spanSeconds.classList.add('alerta-roja');
            } else {
                spanSeconds.classList.remove('alerta-roja');
            }
        }

        function iniciarReloj(targetIso, data) {
            const targetTime = new Date(targetIso).getTime();

            const tick = () => {
                const now = new Date().getTime();
                const diff = targetTime - now;

                if (diff <= 0) {
                    clearInterval(intervalo);
                    revelarRegalo(data);
                    return true;
                }

                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                const totalSegundos = Math.floor(diff / 1000);

                document.getElementById('days').innerText = d;
                document.getElementById('hours').innerText = h;
                document.getElementById('minutes').innerText = m;
                document.getElementById('seconds').innerText = s;

                actualizarVisibilidadCajas(d, h, m, totalSegundos);
                return false;
            };

            if (!tick()) {
                var intervalo = setInterval(() => {
                    tick();
                }, 1000);
            }
        }

        function revelarRegalo(data) {
            const lienzo = document.getElementById('lienzoLuzFluida');
            if (lienzo) lienzo.classList.add('hidden');

            document.getElementById('headerEspera').classList.add('hidden');
            document.getElementById('headerRevelacion').classList.remove('hidden');
            document.getElementById('countdownBox').classList.add('hidden');
            document.getElementById('candadoBox').classList.add('hidden');
            document.getElementById('revealedBox').classList.remove('hidden');

            document.getElementById('txtMarquesina').innerText = `⚡ ${data.mensaje} ⚡`;
            document.getElementById('ledPanelContainer').classList.remove('hidden');

            const body = document.getElementById('bodyBg');
            if(data.estilo === 'pareja') {
                body.className = "p-3 sm:p-4 flex flex-col items-center justify-center min-h-screen text-white bg-pareja-revelado";
            } else {
                const gifFuegos = fondosFuegosArtificiales[data.estilo] || fondosFuegosArtificiales['familiar'];
                body.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('${gifFuegos}')`;
            }

            const container = document.getElementById('contenidoSorpresaContainer');
            
            if(data.tipoSorpresa === 'audio') {
                container.innerHTML = `
                    <div class="bg-black/50 backdrop-blur-md p-4 rounded-3xl border border-white/20 shadow-2xl">
                        <p class="text-xs mb-3 font-extrabold text-amber-300 drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">🎵 Nota de Voz Recibida</p>
                        <audio controls class="w-full shadow-lg rounded-xl"><source src="${data.contenidoSorpresa}" type="audio/mp3">Tu navegador no soporta audio.</audio>
                    </div>`;
            } else if(data.tipoSorpresa === 'foto') {
                container.innerHTML = `
                    <div class="w-full">
                        <p class="text-xs mb-2 font-extrabold text-amber-300 drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">🖼️ Foto Secreta Revelada</p>
                        <img src="${data.contenidoSorpresa}" class="w-full max-h-[75vh] object-contain rounded-2xl mx-auto block shadow-[0_0_30px_rgba(0,0,0,0.8)] border border-white/20">
                    </div>`;
            } else if(data.tipoSorpresa === 'cupon') {
                container.innerHTML = `
                    <div class="bg-black/50 backdrop-blur-md p-4 rounded-3xl border border-white/20 shadow-2xl space-y-3">
                        <p class="text-xs font-extrabold text-amber-300 drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">🎟️ ¡Premio Desbloqueado!</p>
                        <p class="text-[11px] text-slate-200 italic">✨ Rasca el recuadro con tu dedo para ver tu premio ✨</p>
                        
                        <div class="scratch-container relative w-full h-28 rounded-2xl overflow-hidden border-2 border-dashed border-amber-300 shadow-2xl bg-black/80 flex items-center justify-center p-3">
                            <div class="text-base sm:text-lg font-extrabold text-amber-100 z-0 text-center px-2">
                                ${data.contenidoSorpresa}
                            </div>
                            <canvas id="scratchCanvas" class="scratch-canvas"></canvas>
                        </div>

                        <button onclick="reclamarPremio('${data.de}', '${data.contenidoSorpresa}')" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-xl text-xs shadow-2xl transition-all active:scale-95">
                            🎁 Reclamar Premio (Enviar a WhatsApp)
                        </button>
                    </div>
                `;

                setTimeout(initScratchCard, 100);
            }

            if(typeof confetti === 'function') confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 } });
        }

        function initScratchCard() {
            const canvas = document.getElementById('scratchCanvas');
            if(!canvas) return;
            const ctx = canvas.getContext('2d');
            const parent = canvas.parentElement;

            canvas.width = parent.offsetWidth;
            canvas.height = parent.offsetHeight;

            const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grad.addColorStop(0, '#F59E0B');
            grad.addColorStop(0.5, '#FCD34D');
            grad.addColorStop(1, '#D97706');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#78350F';
            ctx.font = 'bold 15px Plus Jakarta Sans, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('✨ RASCA AQUÍ CON TU DEDO ✨', canvas.width / 2, canvas.height / 2);

            let isDrawing = false;

            function scratch(x, y) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 22, 0, Math.PI * 2, false);
                ctx.fill();
            }

            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                let clientX = e.clientX;
                let clientY = e.clientY;

                if (e.touches && e.touches.length > 0) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                }

                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            }

            canvas.addEventListener('mousedown', (e) => { isDrawing = true; const p = getPos(e); scratch(p.x, p.y); });
            canvas.addEventListener('mousemove', (e) => { if (isDrawing) { const p = getPos(e); scratch(p.x, p.y); } });
            canvas.addEventListener('mouseup', () => isDrawing = false);

            canvas.addEventListener('touchstart', (e) => { isDrawing = true; const p = getPos(e); scratch(p.x, p.y); }, {passive: true});
            canvas.addEventListener('touchmove', (e) => { if (isDrawing) { const p = getPos(e); scratch(p.x, p.y); } }, {passive: true});
            canvas.addEventListener('touchend', () => isDrawing = false);
        }

        function reclamarPremio(remitente, premio) {
            const texto = `¡Hola ${remitente}! He abierto mi regalo con temporizador y reclamé mi premio: *${premio}* 🎉 ¡Vengo a canjearlo!`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, '_blank');
        }
    </script>
