<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorpresa Programada</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        /* Estilo de Letrero LED Comercial Gigante (Se mantiene intacto) */
        .led-panel {
            background-color: #000000;
            background-image: radial-gradient(rgba(255, 255, 255, 0.2) 1.5px, transparent 0);
            background-size: 4px 4px;
            border: 4px solid #222;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.98), 0 0 30px rgba(255, 0, 128, 0.4);
            font-family: 'Orbitron', sans-serif;
        }

        /* Degradado multicolor vibrante con resplandor neón intenso */
        .texto-multicolor-neon {
            background: linear-gradient(90deg, #ff0055, #ffae00, #00ffcc, #0066ff, #ff0055);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradienteMovimiento 3s linear infinite, brilloNeon 1.5s ease-in-out infinite alternate;
        }

        @keyframes gradienteMovimiento {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        @keyframes brilloNeon {
            0% { filter: drop-shadow(0 0 5px rgba(255,0,85,0.9)) drop-shadow(0 0 15px rgba(0,255,204,0.7)); }
            100% { filter: drop-shadow(0 0 12px rgba(255,174,0,1)) drop-shadow(0 0 25px rgba(0,102,255,0.9)); }
        }

        /* Animación de rotación para el candado */
        @keyframes girarCandado {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(10deg) scale(1.05); }
            100% { transform: rotate(0deg) scale(1); }
        }
        .candado-animado {
            animation: girarCandado 3s ease-in-out infinite;
        }

        /* Transición suave para el fondo de fuegos artificiales */
        body {
            transition: background 0.8s ease-in-out;
        }
    </style>
</head>
<body id="bodyBg" class="p-4 flex flex-col items-center justify-center min-h-screen text-white bg-cover bg-center bg-no-repeat">

    <!-- CONTENEDOR PRINCIPAL CON TRANSPARENCIA, BORDES BRILLANTES Y SOMBRA NEGRA PROFUNDA -->
    <div id="mainContainer" class="w-full max-w-md backdrop-blur-md bg-black/35 border border-white/30 p-6 rounded-3xl shadow-[0_0_35px_rgba(0,0,0,0.85)] text-center space-y-5 relative overflow-hidden">
        
        <!-- CABECERA: PARA / DE -->
        <div class="space-y-1">
            <span id="badgeEstilo" class="text-[10px] px-3 py-1 rounded-full uppercase tracking-widest font-bold shadow-md">Sorpresa Protegida</span>
            <h2 class="text-sm font-semibold opacity-100 text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">Para: <span id="txtPara" class="font-extrabold text-amber-200">...</span></h2>
            <p class="text-xs text-slate-200 drop-shadow-[0_1px_3px_rgba(0,0,0,0.9)]">De parte de: <span id="txtDe" class="font-bold text-white">...</span></p>
        </div>

        <!-- CANDADO DE PROTECCIÓN ANIMADO -->
        <div id="candadoBox" class="relative w-40 h-40 mx-auto rounded-3xl bg-black/40 backdrop-blur-sm flex flex-col items-center justify-center p-3 shadow-2xl border-2 border-white/20">
            <div class="candado-animado text-6xl mb-1 filter drop-shadow-[0_0_10px_rgba(255,215,0,0.5)]">🔐</div>
            <span class="text-[10px] text-amber-300 font-bold uppercase tracking-wider drop-shadow">Bloqueado</span>
        </div>

        <!-- MODO TEMPORIZADOR CON TARJETAS SEMITRANSPARENTES -->
        <div id="countdownBox" class="space-y-3">
            <p class="text-xs text-amber-100 font-semibold drop-shadow-[0_1px_3px_rgba(0,0,0,0.9)]">El contenido se desbloqueará en:</p>
            <div class="grid grid-cols-4 gap-1.5 text-center">
                <div class="bg-black/40 backdrop-blur-sm p-2.5 rounded-xl border border-white/20 shadow-lg">
                    <span id="days" class="text-xl font-extrabold block text-white drop-shadow">00</span>
                    <span class="text-[8px] uppercase text-amber-200 font-bold">Días</span>
                </div>
                <div class="bg-black/40 backdrop-blur-sm p-2.5 rounded-xl border border-white/20 shadow-lg">
                    <span id="hours" class="text-xl font-extrabold block text-white drop-shadow">00</span>
                    <span class="text-[8px] uppercase text-amber-200 font-bold">Horas</span>
                </div>
                <div class="bg-black/40 backdrop-blur-sm p-2.5 rounded-xl border border-white/20 shadow-lg">
                    <span id="minutes" class="text-xl font-extrabold block text-white drop-shadow">00</span>
                    <span class="text-[8px] uppercase text-amber-200 font-bold">Min</span>
                </div>
                <div class="bg-black/40 backdrop-blur-sm p-2.5 rounded-xl border border-white/20 shadow-lg">
                    <span id="seconds" class="text-xl font-extrabold block text-white drop-shadow">00</span>
                    <span class="text-[8px] uppercase text-amber-200 font-bold">Seg</span>
                </div>
            </div>
            <p class="text-[10px] italic text-amber-200/90 drop-shadow">🔒 Protegido con candado hasta finalizar el tiempo.</p>
        </div>

        <!-- MODO REVELADO CON TRANSPARENCIA -->
        <div id="revealedBox" class="hidden space-y-4">
            <div id="contenidoSorpresaContainer" class="p-4 rounded-3xl bg-black/40 backdrop-blur-md border border-white/30 text-center shadow-[0_0_25px_rgba(0,0,0,0.8)] relative overflow-hidden">
                <!-- Se inyecta la sorpresa elegida -->
            </div>
        </div>

        <!-- LETRERO LED DIGITAL GIGANTE (SE MANTIENE IGUAL) -->
        <div id="ledPanelContainer" class="hidden w-full space-y-1">
            <div class="led-panel w-full py-7 px-1 rounded-2xl overflow-hidden shadow-2xl relative border-amber-500/50">
                <marquee scrollamount="9" scrolldelay="20" class="w-full flex items-center">
                    <span id="txtMarquesina" class="texto-multicolor-neon text-5xl sm:text-6xl font-black tracking-wider uppercase leading-none"></span>
                </marquee>
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC-PGLDqJ2GLfm3ZaXdSxxlvm8MerM1nJY",
            authDomain: "appdetallesamor.firebaseapp.com",
            projectId: "appdetallesamor",
            storageBucket: "appdetallesamor.firebasestorage.app",
            messagingSenderId: "917968456649",
            appId: "1:917968456649:web:32261e841942825685b618"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let datosGlobales = {};

        // GIFS DE FUEGOS ARTIFICIALES BRILLANTES DE ALTA DEFINICIÓN
        const fondosFuegosArtificiales = {
            familiar: "https://media.giphy.com/media/26tOZ42Mg6pbTUPHW/giphy.gif",
            pareja: "https://media.giphy.com/media/l3d03k1B3b5zPqC2A/giphy.gif",
            cumpleaños: "https://media.giphy.com/media/3o7tT127O8vXzE2F6U/giphy.gif"
        };

        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if(!id) return;

            const doc = await db.collection("temporizadores").doc(id).get();
            if(doc.exists) {
                datosGlobales = doc.data();
                aplicarEstilo(datosGlobales.estilo);
                document.getElementById('txtPara').innerText = datosGlobales.para;
                document.getElementById('txtDe').innerText = datosGlobales.de;

                iniciarReloj(datosGlobales.targetDate, datosGlobales);
            }
        });

        function aplicarEstilo(estilo) {
            const body = document.getElementById('bodyBg');
            const container = document.getElementById('mainContainer');
            const badge = document.getElementById('badgeEstilo');

            if(estilo === 'familiar') {
                body.style.background = "linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #334155 100%)";
                container.className += " border-cyan-400/40";
                badge.className += " bg-cyan-500 text-white";
                badge.innerText = "✨ Edición Mágica";
            } else if(estilo === 'pareja') {
                body.style.background = "linear-gradient(135deg, #230408 0%, #3B0A11 50%, #58111A 100%)";
                container.className += " border-rose-400/40";
                badge.className += " bg-rose-500 text-white";
                badge.innerText = "💖 Edición Romántica";
            } else {
                body.style.background = "linear-gradient(135deg, #31103F 0%, #4C1D95 50%, #6D28D9 100%)";
                container.className += " border-amber-400/40";
                badge.className += " bg-amber-400 text-amber-950";
                badge.innerText = "🎉 Edición Cumpleaños";
            }
        }

        function iniciarReloj(targetIso, data) {
            const targetTime = new Date(targetIso).getTime();

            const intervalo = setInterval(() => {
                const now = new Date().getTime();
                const diff = targetTime - now;

                if(diff <= 0) {
                    clearInterval(intervalo);
                    revelarRegalo(data);
                    return;
                }

                document.getElementById('days').innerText = Math.floor(diff / (1000*60*60*24));
                document.getElementById('hours').innerText = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
                document.getElementById('minutes').innerText = Math.floor((diff % (1000*60*60)) / (1000*60));
                document.getElementById('seconds').innerText = Math.floor((diff % (1000*60)) / 1000);
            }, 1000);
        }

        function revelarRegalo(data) {
            document.getElementById('countdownBox').classList.add('hidden');
            document.getElementById('candadoBox').classList.add('hidden');
            document.getElementById('revealedBox').classList.remove('hidden');

            // Asigna el texto y muestra el letrero LED Gigante
            document.getElementById('txtMarquesina').innerText = `⚡ ${data.mensaje} ⚡`;
            document.getElementById('ledPanelContainer').classList.remove('hidden');

            // APLICA EL FONDO COMPLETO DE FUEGOS ARTIFICIALES
            const body = document.getElementById('bodyBg');
            const gifFuegos = fondosFuegosArtificiales[data.estilo] || fondosFuegosArtificiales['familiar'];
            body.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('${gifFuegos}')`;

            const container = document.getElementById('contenidoSorpresaContainer');
            if(data.tipoSorpresa === 'audio') {
                container.innerHTML = `<p class="text-xs mb-3 font-extrabold text-amber-300 drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">🎵 Nota de Voz Recibida</p>
                                       <audio controls class="w-full shadow-lg rounded-xl"><source src="${data.contenidoSorpresa}" type="audio/mp3">Tu navegador no soporta audio.</audio>`;
            } else if(data.tipoSorpresa === 'foto') {
                /* LA FOTO SE MANTIENE 100% SÓLIDA SIN TRANSPARENCIA NI FILTROS */
                container.innerHTML = `<p class="text-xs mb-3 font-extrabold text-amber-300 drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">🖼️ Foto Secreta Revelada</p>
                                       <div class="p-2 bg-black rounded-2xl border border-white/20 shadow-2xl">
                                           <img src="${data.contenidoSorpresa}" class="w-full max-h-80 object-contain rounded-xl mx-auto block opacity-100">
                                       </div>`;
            } else if(data.tipoSorpresa === 'cupon') {
                container.innerHTML = `<p class="text-xs mb-3 font-extrabold text-amber-300 drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]">🎟️ ¡Premio Desbloqueado!</p>
                                       <div class="p-4 bg-black/80 rounded-2xl border-2 border-dashed border-amber-300 text-base font-extrabold text-amber-100 shadow-2xl drop-shadow">${data.contenidoSorpresa}</div>
                                       <button onclick="reclamarPremio('${data.de}', '${data.contenidoSorpresa}')" class="mt-4 w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-xl text-xs shadow-2xl transition-all active:scale-95">
                                           🎁 Reclamar Premio (Enviar a WhatsApp)
                                       </button>`;
            }

            if(typeof confetti === 'function') confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 } });
        }

        function reclamarPremio(remitente, premio) {
            const texto = `¡Hola ${remitente}! He abierto mi regalo con temporizador y reclamé mi premio: *${premio}* 🎉 ¡Vengo a canjearlo!`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`, '_blank');
        }
    </script>
</body>
</html>
