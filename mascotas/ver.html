<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Placa de Identificación - Mascota</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #334155 100%);
        }
        .pulse-red {
            animation: pulseRed 2s infinite;
        }
        @keyframes pulseRed {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* EFECTO DE BORDE CON MOVIMIENTO Y RESPLANDOR NEÓN */
        .borde-animado-box {
            position: relative;
            padding: 4px;
            border-radius: 1.75rem;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.4);
        }

        .borde-animado-box::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, #06b6d4, #3b82f6, #a855f7, #ec4899, #06b6d4);
            animation: girarBorde 4s linear infinite;
            z-index: 0;
        }

        .borde-animado-box .img-inner-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            border-radius: 1.5rem;
            overflow: hidden;
            z-index: 1;
        }

        @keyframes girarBorde {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen text-white">

    <div id="mainCard" class="w-full max-w-md backdrop-blur-xl bg-slate-900/85 border border-cyan-500/30 p-6 rounded-3xl shadow-2xl text-center space-y-5 relative overflow-hidden hidden">
        
        <!-- ALERTA DE EMERGENCIA -->
        <div class="bg-red-500/20 border border-red-500/40 p-2.5 rounded-2xl flex items-center justify-center space-x-2 text-red-300 text-xs font-extrabold pulse-red">
            <i class="fa-solid fa-triangle-exclamation text-base"></i>
            <span>¡SI ME ENCONTRASTE, POR FAVOR CONTACTA A MI DUEÑO!</span>
        </div>

        <!-- INSIGNIA DE RECOMPENSA -->
        <div id="boxRecompensa" class="hidden bg-gradient-to-r from-amber-500 to-yellow-600 text-amber-950 px-4 py-2.5 rounded-2xl font-black text-xs shadow-lg flex items-center justify-center space-x-2 border border-amber-300/50">
            <span class="text-base">🎁</span>
            <span id="txtRecompensa"></span>
        </div>

        <!-- FOTO DE LA MASCOTA CON BORDE EN MOVIMIENTO -->
        <div class="space-y-3">
            <div class="borde-animado-box w-52 h-52 mx-auto">
                <div class="img-inner-container">
                    <img id="imgMascota" src="" alt="Mascota" class="w-full h-full object-cover">
                </div>
            </div>

            <div>
                <h1 id="txtNombre" class="text-3xl font-extrabold text-white tracking-wide">...</h1>
                <p id="txtRaza" class="text-xs font-semibold text-cyan-300 uppercase tracking-widest mt-1">...</p>
                <p id="txtColonia" class="text-[11px] text-slate-300 mt-1 font-bold">📍 Zona: <span id="valColonia">...</span></p>
            </div>
        </div>

        <!-- SEÑAS PARTICULARES / MEDICAMENTOS -->
        <div class="p-4 bg-black/40 rounded-2xl border border-white/10 text-left space-y-1.5">
            <span class="text-[10px] font-bold text-amber-300 uppercase tracking-wider block">📋 Notas Importantes / Señas</span>
            <p id="txtDetalles" class="text-xs text-slate-200 leading-relaxed">...</p>
        </div>

        <!-- BOTONES DE CONTACTO DIRECTO -->
        <div class="space-y-3 pt-1">
            <a id="btnLlamar" href="#" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-2xl shadow-lg text-sm transition-all active:scale-95 flex items-center justify-center space-x-2">
                <i class="fa-solid fa-phone text-base"></i>
                <span>Llamar al Dueño Ahora</span>
            </a>

            <button id="btnWhatsapp" onclick="enviarWhatsappUbicacion()" class="w-full py-3.5 bg-teal-600 hover:bg-teal-700 text-white font-extrabold rounded-2xl shadow-lg text-sm transition-all active:scale-95 flex items-center justify-center space-x-2">
                <i class="fa-brands fa-whatsapp text-lg"></i>
                <span>Enviar mi Ubicación por WhatsApp</span>
            </button>
        </div>

    </div>

    <!-- PANTALLA DE CARGA -->
    <div id="loading" class="text-center space-y-2">
        <div class="inline-block w-8 h-8 border-4 border-cyan-400 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-xs text-slate-300">Cargando datos de la mascota...</p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC-PGLDqJ2GLfm3ZaXdSxxlvm8MerM1nJY",
            authDomain: "appdetallesamor.firebaseapp.com",
            projectId: "appdetallesamor",
            storageBucket: "appdetallesamor.firebasestorage.app",
            messagingSenderId: "917968456649",
            appId: "1:917968456649:web:32261e841942825685b618"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let datosMascota = {};

        window.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if(!id) return;

            try {
                const doc = await db.collection("mascotas").doc(id).get();
                if(doc.exists) {
                    datosMascota = doc.data();
                    
                    document.getElementById('imgMascota').src = datosMascota.foto;
                    document.getElementById('txtNombre').innerText = datosMascota.nombre;
                    document.getElementById('txtRaza').innerText = datosMascota.raza;
                    document.getElementById('valColonia').innerText = datosMascota.colonia || "No especificada";
                    document.getElementById('txtDetalles').innerText = datosMascota.detalles;

                    if(datosMascota.recompensa && datosMascota.recompensa.trim() !== "") {
                        document.getElementById('txtRecompensa').innerText = `RECOMPENSA: ${datosMascota.recompensa}`;
                        document.getElementById('boxRecompensa').classList.remove('hidden');
                    }

                    document.getElementById('btnLlamar').href = `tel:${datosMascota.telefono}`;

                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('mainCard').classList.remove('hidden');
                }
            } catch(e) {
                console.error("Error al cargar datos:", e);
            }
        });

        function enviarWhatsappUbicacion() {
            if(!datosMascota.telefono) return;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const mapUrl = `https://maps.google.com/?q=${lat},${lon}`;
                    
                    const mensaje = `¡Hola! Encontré a tu mascota *${datosMascota.nombre}*. Mi ubicación GPS actual es: ${mapUrl}`;
                    window.open(`https://api.whatsapp.com/send?phone=${datosMascota.telefono}&text=${encodeURIComponent(mensaje)}`, '_blank');
                }, () => {
                    const mensaje = `¡Hola! Encontré a tu mascota *${datosMascota.nombre}*. Por favor contáctame para coordinar la entrega.`;
                    window.open(`https://api.whatsapp.com/send?phone=${datosMascota.telefono}&text=${encodeURIComponent(mensaje)}`, '_blank');
                });
            } else {
                const mensaje = `¡Hola! Encontré a tu mascota *${datosMascota.nombre}*. Por favor contáctame.`;
                window.open(`https://api.whatsapp.com/send?phone=${datosMascota.telefono}&text=${encodeURIComponent(mensaje)}`, '_blank');
            }
        }
    </script>
</body>
</html>
