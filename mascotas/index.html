<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Creador - Placa QR de Mascota</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #334155 100%);
        }
        .selector-modelo:checked + div {
            border-color: #38bdf8;
            background-color: rgba(6, 182, 212, 0.2);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen text-white">

    <div class="w-full max-w-md backdrop-blur-xl bg-slate-900/80 border border-cyan-500/30 p-6 rounded-3xl shadow-2xl text-center space-y-5 relative overflow-hidden">
        
        <!-- ENCABEZADO -->
        <div class="space-y-1">
            <span class="text-[10px] bg-cyan-600 text-cyan-100 px-3 py-1 rounded-full uppercase tracking-widest font-bold">🐶 Placa QR Inteligente</span>
            <h1 class="text-xl font-extrabold text-white">Registro de Mascota</h1>
            <p class="text-xs text-slate-300">Selecciona el diseño de tu medalla y crea el perfil de emergencia.</p>
        </div>

        <!-- FORMULARIO -->
        <div id="formContainer" class="space-y-4 text-left">
            <div>
                <label class="block text-xs font-bold text-cyan-300 mb-1">Nombre de la Mascota *</label>
                <input type="text" id="nombreMascota" placeholder="Ej. Max" class="w-full p-3 bg-black/40 border border-white/20 rounded-xl text-sm focus:outline-none focus:border-cyan-400 focus:placeholder:opacity-0">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-cyan-300 mb-1">Especie / Raza</label>
                    <input type="text" id="razaMascota" placeholder="Ej. Perro / Pitbull" class="w-full p-3 bg-black/40 border border-white/20 rounded-xl text-sm focus:outline-none focus:border-cyan-400 focus:placeholder:opacity-0">
                </div>
                <div>
                    <label class="block text-xs font-bold text-cyan-300 mb-1">Teléfono / WhatsApp *</label>
                    <input type="tel" id="telefonoDuenio" placeholder="Ej. 8112345678" class="w-full p-3 bg-black/40 border border-white/20 rounded-xl text-sm focus:outline-none focus:border-cyan-400 focus:placeholder:opacity-0">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-cyan-300 mb-1">Colonia / Sector (Seguro)</label>
                    <input type="text" id="coloniaMascota" placeholder="Ej. Col. Cumbres" class="w-full p-3 bg-black/40 border border-white/20 rounded-xl text-sm focus:outline-none focus:border-cyan-400 focus:placeholder:opacity-0">
                </div>
                <div>
                    <label class="block text-xs font-bold text-amber-300 mb-1">💰 Recompensa (Opcional)</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-3 text-amber-300 font-bold text-sm">$</span>
                        <input type="text" id="recompensaMascota" placeholder="1000 MXN" class="w-full p-3 pl-7 bg-black/40 border border-amber-400/40 rounded-xl text-sm focus:outline-none focus:border-amber-400 focus:placeholder:opacity-0">
                    </div>
                </div>
            </div>

            <!-- SELECCIÓN DE DISEÑO DE PLACA -->
            <div>
                <label class="block text-xs font-bold text-cyan-300 mb-2">💎 Elige el Estilo de tu Placa</label>
                <div class="grid grid-cols-3 gap-2 text-center">
                    <label class="cursor-pointer">
                        <input type="radio" name="estiloPlaca" value="escudo" checked class="selector-modelo hidden">
                        <div class="p-2.5 bg-black/50 border border-white/20 rounded-xl transition-all">
                            <span class="text-xl block">🛡️</span>
                            <span class="text-[10px] font-bold text-slate-200">Escudo</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="estiloPlaca" value="circulo" class="selector-modelo hidden">
                        <div class="p-2.5 bg-black/50 border border-white/20 rounded-xl transition-all">
                            <span class="text-xl block">🟠</span>
                            <span class="text-[10px] font-bold text-slate-200">Neón Azul/Naranja</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="estiloPlaca" value="hueso" class="selector-modelo hidden">
                        <div class="p-2.5 bg-black/50 border border-white/20 rounded-xl transition-all">
                            <span class="text-xl block">🦴</span>
                            <span class="text-[10px] font-bold text-slate-200">Huesito</span>
                        </div>
                    </label>
                </div>
            </div>

            <!-- SUBIR FOTO DESDE GALERÍA/ARCHIVOS -->
            <div>
                <label class="block text-xs font-bold text-cyan-300 mb-1">Foto de la Mascota (1 Imagen)</label>
                <input type="file" id="inputFotoArchivo" accept="image/*" onchange="previewImagen(event)" class="w-full p-2 bg-black/40 border border-white/20 rounded-xl text-xs text-slate-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-cyan-600 file:text-white hover:file:bg-cyan-700 cursor-pointer">
                
                <div id="boxPreview" class="hidden mt-3 relative w-28 h-28 mx-auto rounded-2xl overflow-hidden border-2 border-cyan-400/50 shadow-md">
                    <img id="imgPreview" src="" class="w-full h-full object-cover">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-cyan-300 mb-1">Mensaje para quien lo encuentre / Señas</label>
                <textarea id="detallesMascota" rows="2" placeholder="Ej. Es muy asustadizo, por favor háblale con calma..." class="w-full p-3 bg-black/40 border border-white/20 rounded-xl text-sm focus:outline-none focus:border-cyan-400 focus:placeholder:opacity-0"></textarea>
            </div>

            <button onclick="generarPlacaQR()" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-extrabold rounded-2xl shadow-lg text-sm transition-all active:scale-95">
                🚀 Generar Placa y Código QR
            </button>
        </div>

        <!-- SECCIÓN DE RESULTADO Y TARJETA VISUAL DE PLACA -->
        <div id="resultContainer" class="hidden space-y-4 text-center">
            <div class="p-4 bg-black/60 rounded-3xl border border-cyan-400/40 space-y-3 shadow-2xl">
                <p class="text-xs font-bold text-emerald-300">✨ ¡Diseño de Placa Listo para Impresión!</p>
                
                <!-- CANVAS DONDE SE DIBUJA EL DISEÑO ELEGIDO CON SILUETA EXACTA -->
                <div class="flex justify-center my-2">
                    <canvas id="placaCanvas" width="360" height="420" class="max-w-full h-auto bg-transparent"></canvas>
                </div>

                <div id="qrcodeHidden" class="hidden"></div>
                <p class="text-[11px] text-slate-300 break-all select-all mt-2" id="txtEnlacePublico"></p>
            </div>

            <div class="space-y-2">
                <button onclick="copiarEnlace()" class="w-full py-2.5 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-xl text-xs shadow-md">
                    📋 Copiar Enlace Público
                </button>
                <button onclick="descargarPlacaImagen()" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-extrabold rounded-xl text-xs shadow-lg flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-download"></i>
                    <span>Descargar Imagen de Placa HD</span>
                </button>
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC-PGLDqJ2GLfm3ZaXdSxxlvm8MerM1nJY",
            authDomain: "appdetallesamor.firebaseapp.com",
            projectId: "appdetallesamor",
            storageBucket: "appdetallesamor.firebasestorage.app",
            messagingSenderId: "917968456649",
            appId: "1:917968456649:web:32261e841942825685b618"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let enlaceGenerado = "";
        let fotoBase64 = "https://images.unsplash.com/photo-1543466835-00a7907e9de1";

        function previewImagen(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    fotoBase64 = e.target.result;
                    document.getElementById('imgPreview').src = fotoBase64;
                    document.getElementById('boxPreview').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        async function generarPlacaQR() {
            const nombre = document.getElementById('nombreMascota').value.trim();
            const raza = document.getElementById('razaMascota').value.trim();
            const telefono = document.getElementById('telefonoDuenio').value.trim();
            const colonia = document.getElementById('coloniaMascota').value.trim();
            const recompensaInput = document.getElementById('recompensaMascota').value.trim();
            const detalles = document.getElementById('detallesMascota').value.trim();
            
            const estiloSeleccionado = document.querySelector('input[name="estiloPlaca"]:checked').value;

            if (!nombre || !telefono) {
                alert("Por favor ingresa al menos el nombre de la mascota y el teléfono/WhatsApp de contacto.");
                return;
            }

            const recompensaFinal = recompensaInput ? (recompensaInput.startsWith('$') ? recompensaInput : '$' + recompensaInput) : "";

            try {
                const docRef = await db.collection("mascotas").add({
                    nombre,
                    raza: raza || "No especificada",
                    telefono,
                    colonia: colonia || "No especificada",
                    recompensa: recompensaFinal,
                    foto: fotoBase64,
                    detalles: detalles || "Sin notas adicionales.",
                    estilo: estiloSeleccionado,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                const baseUrl = window.location.href.replace('index.html', '');
                enlaceGenerado = `${baseUrl}ver.html?id=${docRef.id}`;

                document.getElementById('formContainer').classList.add('hidden');
                document.getElementById('resultContainer').classList.remove('hidden');
                document.getElementById('txtEnlacePublico').innerText = enlaceGenerado;

                const qrContainer = document.getElementById('qrcodeHidden');
                qrContainer.innerHTML = "";
                var qr = qrcode(0, 'M');
                qr.addData(enlaceGenerado);
                qr.make();
                qrContainer.innerHTML = qr.createImgTag(6);

                const qrImg = qrContainer.querySelector('img');
                
                setTimeout(() => {
                    dibujarMedallaPlaca(nombre, raza, qrImg.src, estiloSeleccionado);
                }, 150);

            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Hubo un error al generar la placa. Intenta de nuevo.");
            }
        }

        /* DIBUJAR SILUETA VECTORIAL PERFECTA EN CANVAS */
        function dibujarMedallaPlaca(nombre, raza, qrDataUrl, estilo) {
            const canvas = document.getElementById('placaCanvas');
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // FUNCIÓN AUXILIAR PARA TRAZAR LA RUTA DE CADA SILUETA
            function trazarRutaSilueta() {
                ctx.beginPath();
                if (estilo === 'escudo') {
                    // SILUETA ESCUDO
                    ctx.moveTo(180, 25);
                    ctx.lineTo(290, 50);
                    ctx.bezierCurveTo(330, 65, 335, 210, 335, 305);
                    ctx.bezierCurveTo(335, 375, 250, 410, 180, 415);
                    ctx.bezierCurveTo(110, 410, 25, 375, 25, 305);
                    ctx.bezierCurveTo(25, 210, 30, 65, 70, 50);
                    ctx.closePath();
                } else if (estilo === 'circulo') {
                    // SILUETA CÍRCULO CON ARGOLLA
                    ctx.arc(180, 230, 155, 0, Math.PI * 2);
                } else if (estilo === 'hueso') {
                    // SILUETA HUESITO
                    ctx.moveTo(100, 85);
                    ctx.bezierCurveTo(40, 85, 30, 155, 80, 185);
                    ctx.bezierCurveTo(30, 215, 40, 285, 100, 285);
                    ctx.bezierCurveTo(130, 345, 230, 345, 260, 285);
                    ctx.bezierCurveTo(320, 285, 330, 215, 280, 185);
                    ctx.bezierCurveTo(330, 155, 320, 85, 260, 85);
                    ctx.bezierCurveTo(230, 35, 130, 35, 100, 85);
                    ctx.closePath();
                }
            }

            // 1. APLICAR CORTE RESTRINGIDO A LA SILUETA (CLIPPING)
            ctx.save();
            trazarRutaSilueta();
            ctx.clip();

            // 2. RELLENAR FONDO DE LA SILUETA RECORTADA
            if (estilo === 'escudo') {
                const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                grad.addColorStop(0, '#0a192f');
                grad.addColorStop(1, '#020617');
                ctx.fillStyle = grad;
            } else if (estilo === 'circulo') {
                const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                grad.addColorStop(0, '#1e3a8a');
                grad.addColorStop(0.5, '#020617');
                grad.addColorStop(1, '#c2410c');
                ctx.fillStyle = grad;
            } else {
                const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                grad.addColorStop(0, '#0f172a');
                grad.addColorStop(1, '#1e3a8a');
                ctx.fillStyle = grad;
            }
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 3. RESTAURAR MÁSCARA Y DIBUJAR BORDES METALIZADOS
            ctx.restore();

            trazarRutaSilueta();
            ctx.lineWidth = 6;
            ctx.strokeStyle = estilo === 'escudo' ? '#d97706' : (estilo === 'circulo' ? '#fb923c' : '#38bdf8');
            ctx.stroke();

            // 4. ORIFICIO DE LA ARGOLLA SUPERIOR
            ctx.save();
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(180, 35, 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = estilo === 'escudo' ? '#d97706' : (estilo === 'circulo' ? '#fb923c' : '#38bdf8');
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.restore();

            // 5. TEXTOS Y CONTENIDO
            ctx.fillStyle = '#38bdf8';
            ctx.font = 'extrabold 11px Plus Jakarta Sans, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('🐾 PLACA QR DE EMERGENCIA 🐾', 180, 75);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 24px Plus Jakarta Sans, sans-serif';
            ctx.fillText(nombre.toUpperCase(), 180, 105);

            ctx.fillStyle = estilo === 'escudo' ? '#d97706' : '#fde047';
            ctx.font = 'bold 12px Plus Jakarta Sans, sans-serif';
            ctx.fillText(raza.toUpperCase(), 180, 125);

            // 6. DIBUJAR CÓDIGO QR
            const qrImg = new Image();
            qrImg.onload = function() {
                const qrSize = 185;
                const qrX = (canvas.width - qrSize) / 2;
                const qrY = 140;

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.roundRect(qrX - 8, qrY - 8, qrSize + 16, qrSize + 16, 14);
                ctx.fill();

                ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);

                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 10px Plus Jakarta Sans, sans-serif';
                ctx.fillText('SCAN ME / ESCANÉAME PARA CONTACTO', 180, qrY + qrSize + 24);
                
                ctx.fillStyle = '#94a3b8';
                ctx.font = '9px Plus Jakarta Sans, sans-serif';
                ctx.fillText('Soluciones QR • Protección de Mascota', 180, canvas.height - 20);
            };
            qrImg.src = qrDataUrl;
        }

        function copiarEnlace() {
            navigator.clipboard.writeText(enlaceGenerado);
            alert("¡Enlace copiado al portapapeles!");
        }

        function descargarPlacaImagen() {
            const canvas = document.getElementById('placaCanvas');
            const link = document.createElement('a');
            link.download = 'placa-collar-mascota.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
