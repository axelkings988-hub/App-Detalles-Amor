<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Creador - Placa QR de Mascota</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #334155 100%);
        }
        .selector-modelo:checked + div, .selector-color:checked + div {
            border-color: #38bdf8 !important;
            background-color: rgba(6, 182, 212, 0.25) !important;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
    </style>
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen text-white">

    <div class="w-full max-w-md backdrop-blur-xl bg-slate-900/80 border border-cyan-500/30 p-6 rounded-3xl shadow-2xl text-center space-y-5 relative overflow-hidden">
        
        <div class="space-y-1">
            <span class="text-[10px] bg-cyan-600 text-cyan-100 px-3 py-1 rounded-full uppercase tracking-widest font-bold">🐶 Placa QR Inteligente</span>
            <h1 class="text-xl font-extrabold text-white">Registro de Mascota</h1>
            <p class="text-xs text-slate-300">Personaliza la forma y los colores neón de tu medalla.</p>
        </div>

        <div id="formContainer" class="space-y-4 text-left">
            <div>
                <label class="block text-xs font-bold text-cyan-300 mb-1">Nombre de la Mascota *</label>
                <input type="text" id="nombreMascota" placeholder="Ej. Max" class="w-full p-3 bg-black/40 border border-white/20 rounded-xl text-sm focus:outline-none focus:border-cyan-400">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-cyan-300 mb-1">Especie / Raza</label>
                    <input type="text" id="razaMascota" placeholder="Ej. Perro / Pitbull" class="w-full p-3 bg-black/40 border border-white/20 rounded-xl text-sm focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-cyan-300 mb-1">Teléfono / WhatsApp *</label>
                    <input type="tel" id="telefonoDuenio" placeholder="Ej. 8112345678" class="w-full p-3 bg-black/40 border border-white/20 rounded-xl text-sm focus:outline-none focus:border-cyan-400">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-cyan-300 mb-1">Colonia / Sector (Seguro)</label>
                    <input type="text" id="coloniaMascota" placeholder="Ej. Col. Cumbres" class="w-full p-3 bg-black/40 border border-white/20 rounded-xl text-sm focus:outline-none focus:border-cyan-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-amber-300 mb-1">💰 Recompensa (Opcional)</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-3 text-amber-300 font-bold text-sm">$</span>
                        <input type="text" id="recompensaMascota" placeholder="1000 MXN" class="w-full p-3 pl-7 bg-black/40 border border-amber-400/40 rounded-xl text-sm focus:outline-none focus:border-amber-400">
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-cyan-300 mb-2">💎 1. Elige la Forma de la Placa</label>
                <div class="grid grid-cols-3 gap-2 text-center">
                    <label class="cursor-pointer">
                        <input type="radio" name="estiloPlaca" value="escudo" checked class="selector-modelo hidden">
                        <div class="p-2.5 bg-black/50 border border-white/20 rounded-xl transition-all">
                            <span class="text-xl block">🛡️</span>
                            <span class="text-[10px] font-bold text-slate-200">Escudo</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="estiloPlaca" value="circulo" class="selector-modelo hidden">
                        <div class="p-2.5 bg-black/50 border border-white/20 rounded-xl transition-all">
                            <span class="text-xl block">⚪</span>
                            <span class="text-[10px] font-bold text-slate-200">Círculo</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="estiloPlaca" value="hueso" class="selector-modelo hidden">
                        <div class="p-2.5 bg-black/50 border border-white/20 rounded-xl transition-all">
                            <span class="text-xl block">🦴</span>
                            <span class="text-[10px] font-bold text-slate-200">Huesito</span>
                        </div>
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-cyan-300 mb-2">🎨 2. Elige la Paleta de Colores Neón</label>
                <div class="grid grid-cols-5 gap-1.5 text-center">
                    <label class="cursor-pointer">
                        <input type="radio" name="paletaColor" value="paleta1" checked class="selector-color hidden">
                        <div class="p-1.5 bg-black/50 border border-white/20 rounded-xl transition-all flex flex-col items-center">
                            <div class="w-full h-4 rounded-md mb-1 bg-gradient-to-tr from-[#0F0F1A] via-[#FF00BF] to-[#99FF00]"></div>
                            <span class="text-[8px] font-bold text-slate-200">Lima</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="paletaColor" value="paleta2" class="selector-color hidden">
                        <div class="p-1.5 bg-black/50 border border-white/20 rounded-xl transition-all flex flex-col items-center">
                            <div class="w-full h-4 rounded-md mb-1 bg-gradient-to-tr from-[#2B2B33] via-[#B57EDC] to-[#FF6600]"></div>
                            <span class="text-[8px] font-bold text-slate-200">Cálida</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="paletaColor" value="paleta3" class="selector-color hidden">
                        <div class="p-1.5 bg-black/50 border border-white/20 rounded-xl transition-all flex flex-col items-center">
                            <div class="w-full h-4 rounded-md mb-1 bg-gradient-to-tr from-[#001C3D] via-[#00FFFF] to-[#FFFFFF]"></div>
                            <span class="text-[8px] font-bold text-slate-200">Cian</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="paletaColor" value="paleta4" class="selector-color hidden">
                        <div class="p-1.5 bg-black/50 border border-white/20 rounded-xl transition-all flex flex-col items-center">
                            <div class="w-full h-4 rounded-md mb-1 bg-gradient-to-tr from-[#3B1F4A] via-[#A8E6CF] to-[#FF1493]"></div>
                            <span class="text-[8px] font-bold text-slate-200">Fucsia</span>
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="paletaColor" value="paleta5" class="selector-color hidden">
                        <div class="p-1.5 bg-black/50 border border-white/20 rounded-xl transition-all flex flex-col items-center">
                            <div class="w-full h-4 rounded-md mb-1 bg-gradient-to-tr from-[#455A64] via-[#FFF9C4] to-[#1DE9B6]"></div>
                            <span class="text-[8px] font-bold text-slate-200">Tropical</span>
                        </div>
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-cyan-300 mb-1">Foto de la Mascota (1 Imagen)</label>
                <input type="file" id="inputFotoArchivo" accept="image/*" onchange="previewImagen(event)" class="w-full p-2 bg-black/40 border border-white/20 rounded-xl text-xs text-slate-300 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-cyan-600 file:text-white hover:file:bg-cyan-700 cursor-pointer">
                
                <div id="boxPreview" class="hidden mt-3 relative w-28 h-28 mx-auto rounded-2xl overflow-hidden border-2 border-cyan-400/50 shadow-md">
                    <img id="imgPreview" src="" class="w-full h-full object-cover">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-cyan-300 mb-1">Mensaje para quien lo encuentre / Señas</label>
                <textarea id="detallesMascota" rows="2" placeholder="Ej. Es muy asustadizo, por favor háblale con calma..." class="w-full p-3 bg-black/40 border border-white/20 rounded-xl text-sm focus:outline-none focus:border-cyan-400"></textarea>
            </div>

            <button onclick="generarPlacaQR()" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-extrabold rounded-2xl shadow-lg text-sm transition-all active:scale-95">
                🚀 Generar Placa y Código QR
            </button>
        </div>

        <div id="resultContainer" class="hidden space-y-4 text-center">
            <div class="p-4 bg-black/60 rounded-3xl border border-cyan-400/40 space-y-3 shadow-2xl">
                <p class="text-xs font-bold text-emerald-300">✨ ¡Diseño de Placa Listo para Impresión!</p>
                
                <div class="flex justify-center my-2">
                    <canvas id="placaCanvas" width="1024" height="1024" class="max-w-full h-auto rounded-xl shadow-2xl"></canvas>
                </div>

                <div id="qrcodeHidden" class="hidden"></div>
                <p class="text-[11px] text-slate-300 break-all select-all mt-2" id="txtEnlacePublico"></p>
            </div>

            <div class="space-y-2">
                <button onclick="copiarEnlace()" class="w-full py-2.5 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-xl text-xs shadow-md">
                    📋 Copiar Enlace Público
                </button>
                <button onclick="descargarPlacaImagen()" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-extrabold rounded-xl text-xs shadow-lg flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-download"></i>
                    <span>Descargar Imagen de Placa HD</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC-PGLDqJ2GLfm3ZaXdSxxlvm8MerM1nJY",
            authDomain: "appdetallesamor.firebaseapp.com",
            projectId: "appdetallesamor",
            storageBucket: "appdetallesamor.firebasestorage.app",
            messagingSenderId: "917968456649",
            appId: "1:917968456649:web:32261e841942825685b618"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let enlaceGenerado = "";
        let fotoBase64 = "https://images.unsplash.com/photo-1543466835-00a7907e9de1";

        const PLACAS = {
            escudo:  { cara: "escudo.png", borde: "escudo borde.png" },
            circulo: { cara: "circulo.png", borde: "circulo borde.png" },
            hueso:   { cara: "Hueso.png", borde: "Hueso borde.png" }
        };

        const PALETAS = {
            paleta1: ['#0F0F1A', '#99FF00', '#FF00BF'],
            paleta2: ['#2B2B33', '#FF6600', '#B57EDC'],
            paleta3: ['#001C3D', '#00FFFF', '#FFFFFF'],
            paleta4: ['#3B1F4A', '#FF1493', '#A8E6CF'],
            paleta5: ['#455A64', '#1DE9B6', '#FFF9C4']
        };

        function previewImagen(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    fotoBase64 = e.target.result;
                    document.getElementById('imgPreview').src = fotoBase64;
                    document.getElementById('boxPreview').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        async function generarPlacaQR() {
            const nombre = document.getElementById('nombreMascota').value.trim();
            const raza = document.getElementById('razaMascota').value.trim();
            const telefono = document.getElementById('telefonoDuenio').value.trim();
            const colonia = document.getElementById('coloniaMascota').value.trim();
            const recompensaInput = document.getElementById('recompensaMascota').value.trim();
            const detalles = document.getElementById('detallesMascota').value.trim();
            
            const estiloSeleccionado = document.querySelector('input[name="estiloPlaca"]:checked').value;
            const paletaSeleccionada = document.querySelector('input[name="paletaColor"]:checked').value;

            if (!nombre || !telefono) {
                alert("Por favor ingresa al menos el nombre de la mascota y el teléfono/WhatsApp de contacto.");
                return;
            }

            const recompensaFinal = recompensaInput ? (recompensaInput.startsWith('$') ? recompensaInput : '$' + recompensaInput) : "";

            try {
                const docRef = await db.collection("mascotas").add({
                    nombre,
                    raza: raza || "No especificada",
                    telefono,
                    colonia: colonia || "No especificada",
                    recompensa: recompensaFinal,
                    foto: fotoBase64,
                    detalles: detalles || "Sin notas adicionales.",
                    estilo: estiloSeleccionado,
                    paleta: paletaSeleccionada,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                let baseUrl = window.location.href.split('?')[0];
                baseUrl = baseUrl.replace(/index\.html$/i, '');
                baseUrl = baseUrl.replace(/\/$/, '') + '/';
                enlaceGenerado = baseUrl + "ver.html?id=" + docRef.id;

                document.getElementById('formContainer').classList.add('hidden');
                document.getElementById('resultContainer').classList.remove('hidden');
                document.getElementById('txtEnlacePublico').innerText = enlaceGenerado;

                const qrContainer = document.getElementById('qrcodeHidden');
                qrContainer.innerHTML = "";
                var qr = qrcode(0, 'M');
                qr.addData(enlaceGenerado);
                qr.make();
                qrContainer.innerHTML = qr.createImgTag(8);

                const qrImg = qrContainer.querySelector('img');
                
                setTimeout(() => {
                    dibujarPlacaHiperrealista(nombre, raza || "", qrImg.src, estiloSeleccionado, paletaSeleccionada);
                }, 200);

            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Hubo un error al generar la placa. Intenta de nuevo.");
            }
        }

        function dibujarPlacaHiperrealista(nombre, raza, qrDataUrl, estilo, paletaKey) {
            const canvas = document.getElementById('placaCanvas');
            const ctx = canvas.getContext('2d');
            const size = 1024;

            ctx.clearRect(0, 0, size, size);

            const rutas = PLACAS[estilo];
            
            const imgCara = new Image();
            imgCara.crossOrigin = "anonymous";
            
            const imgBorde = new Image();
            imgBorde.crossOrigin = "anonymous";

            let cargadas = 0;
            function verificarCarga() {
                cargadas++;
                if (cargadas === 2) {
                    renderizarCanvasCompleto(imgCara, imgBorde, nombre, raza, qrDataUrl, estilo, paletaKey);
                }
            }

            imgCara.onload = verificarCarga;
            imgBorde.onload = verificarCarga;

            imgCara.onerror = imgBorde.onerror = function() {
                alert("No se pudieron cargar las capas de la placa. Revisa que las imágenes existan en el repositorio.");
            };

            imgCara.src = rutas.cara;
            imgBorde.src = rutas.borde;
        }

        function renderizarCanvasCompleto(imgCara, imgBorde, nombre, raza, qrDataUrl, estilo, paletaKey) {
            const canvas = document.getElementById('placaCanvas');
            const ctx = canvas.getContext('2d');
            const size = 1024;

            const colores = PALETAS[paletaKey] || PALETAS.paleta1;

            // 1. DIBUJAR LA CARA INTERIOR Y APLICAR EL DEGRADADO DE ALTA GAMA
            ctx.drawImage(imgCara, 0, 0, size, size);

            const grad = ctx.createLinearGradient(0, 0, size, size);
            if (paletaKey === 'paleta1') {
                grad.addColorStop(0,   '#1a0a2e');
                grad.addColorStop(0.35, colores[0]);
                grad.addColorStop(0.7,  colores[2]);
                grad.addColorStop(1,   colores[1]);
            } else if (paletaKey === 'paleta2') {
                grad.addColorStop(0,   '#1a1025');
                grad.addColorStop(0.4,  colores[0]);
                grad.addColorStop(0.75, colores[2]);
                grad.addColorStop(1,   colores[1]);
            } else if (paletaKey === 'paleta3') {
                grad.addColorStop(0,   '#001428');
                grad.addColorStop(0.4,  colores[0]);
                grad.addColorStop(0.8,  '#00e0ff');
                grad.addColorStop(1,   '#ffffff');
            } else if (paletaKey === 'paleta4') {
                grad.addColorStop(0,   '#2b0a3d');
                grad.addColorStop(0.35, '#5c1a7a');
                grad.addColorStop(0.7,  '#c71585');
                grad.addColorStop(1,   '#ff1493');
            } else {
                grad.addColorStop(0,   '#1a2a30');
                grad.addColorStop(0.4,  colores[0]);
                grad.addColorStop(0.75, colores[2]);
                grad.addColorStop(1,   colores[1]);
            }

            ctx.save();
            ctx.globalCompositeOperation = 'source-atop';
            ctx.globalAlpha = 0.92;
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, size, size);
            ctx.restore();

            // 2. DIBUJAR EL BORDE Y RELIEVE METÁLICO POR ENCIMA
            ctx.drawImage(imgBorde, 0, 0, size, size);

            // ===== DISTRIBUCIÓN Y LAYOUT DEL TEXTO =====
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            let nombreY = size * 0.28;
            let razaY = size * 0.35;
            let qrY = size * 0.40;
            let qrSize = 330;
            let footerText1Y = qrY + qrSize + 28;
            let footerText2Y = qrY + qrSize + 52;

            if (estilo === 'circulo') {
                nombreY = size * 0.27;
                razaY = size * 0.34;
                qrY = size * 0.39;
            } else if (estilo === 'hueso') {
                nombreY = size * 0.27;
                razaY = size * 0.34;
                qrY = size * 0.39;
                qrSize = 300;
                footerText1Y = qrY + qrSize + 26;
                footerText2Y = qrY + qrSize + 48;
            }

            // 3. ETIQUETA / MARCA LATERAL VERTICAL (ROTADA A UN COSTADO)
            ctx.save();
            ctx.translate(size * 0.22, size * 0.52); // Posición lateral izquierda limpia
            ctx.rotate(-Math.PI / 2); // Rotación vertical de 90°
            ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
            ctx.shadowBlur = 6;
            ctx.fillStyle = colores[1]; // Color neón brillante coordinado
            ctx.font = '800 13px "Plus Jakarta Sans", Arial, sans-serif';
            ctx.fillText('• PLACA DE EMERGENCIA •', 0, 0);
            ctx.restore();

            // 4. NOMBRE Y RAZA CENTRADOS Y MÁS AMPLIOS EN LA PARTE SUPERIOR
            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            ctx.shadowBlur = 8;
            
            ctx.fillStyle = '#FFFFFF';
            ctx.font = '900 64px "Plus Jakarta Sans", Arial, sans-serif';
            ctx.fillText(nombre.toUpperCase().substring(0, 12), size / 2, nombreY);

            ctx.fillStyle = '#F59E0B';
            ctx.font = '800 32px "Plus Jakarta Sans", Arial, sans-serif';
            ctx.fillText(raza.toUpperCase().substring(0, 18), size / 2, razaY);
            ctx.restore();

            // 5. CÓDIGO QR Y RECUADRO PROTECTOR CON SOMBRA
            const qrImg = new Image();
            qrImg.onload = function() {
                const qrX = (size - qrSize) / 2;

                ctx.save();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
                ctx.shadowBlur = 15;
                ctx.shadowOffsetY = 6;
                ctx.fillStyle = '#FFFFFF';
                ctx.beginPath();
                ctx.roundRect(qrX - 14, qrY - 14, qrSize + 28, qrSize + 28, 20);
                ctx.fill();
                ctx.restore();

                ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);

                // TEXTOS INFERIORES
                ctx.save();
                ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
                ctx.shadowBlur = 6;

                ctx.fillStyle = '#FFFFFF';
                ctx.font = '800 15px "Plus Jakarta Sans", Arial, sans-serif';
                ctx.fillText('SCAN ME / ESCANÉAME PARA CONTACTO', size / 2, footerText1Y);

                ctx.fillStyle = '#F1F5F9';
                ctx.font = '700 12px "Plus Jakarta Sans", Arial, sans-serif';
                ctx.fillText('Soluciones QR • Protección de Mascota', size / 2, footerText2Y);
                ctx.restore();
            };
            qrImg.src = qrDataUrl;
        }

        function copiarEnlace() {
            navigator.clipboard.writeText(enlaceGenerado).then(() => {
                alert("¡Enlace copiado al portapapeles!");
            });
        }

        function descargarPlacaImagen() {
            const canvas = document.getElementById('placaCanvas');
            const link = document.createElement('a');
            link.download = 'placa-collar-mascota.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        }
    </script>
</body>
</html>
