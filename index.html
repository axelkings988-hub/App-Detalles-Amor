<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un Detalle Especial ❤️</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-pink-100 via-red-50 to-pink-200 min-h-screen flex flex-col items-center justify-center p-4 text-gray-800">

    <!-- Pantalla de Carga -->
    <div id="loading" class="text-center py-10">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-red-500 mx-auto mb-4"></div>
        <p class="text-lg font-semibold text-gray-600">Cargando tu detalle especial...</p>
    </div>

    <!-- Contenido del Minisitio (Oculto al inicio) -->
    <div id="content" class="hidden max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden border border-pink-100 p-6 text-center space-y-6">
        
        <!-- Encabezado con Nombres -->
        <div class="space-y-2">
            <span class="bg-red-100 text-red-600 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Un regalo para ti</span>
            <h1 id="title" class="text-3xl font-extrabold text-red-600 mt-2"></h1>
            <p id="date" class="text-sm text-gray-500 italic"></p>
        </div>

        <!-- Carta de Amor -->
        <div class="bg-pink-50 rounded-2xl p-5 border border-pink-100 text-left">
            <p id="message" class="text-gray-700 whitespace-pre-line leading-relaxed text-sm"></p>
        </div>

        <!-- Pie de página -->
        <div class="pt-4 border-t border-gray-100 text-xs text-gray-400">
            Hecho con ❤️ en <span class="font-bold text-red-500">AppDetallesAmor</span>
        </div>
    </div>

    <!-- Script con Firebase v13 (Mismo formato que tu index.html) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        // Credenciales idénticas a tu index.html
        const firebaseConfig = {
            apiKey: "AIzaSyC-PGLDqJ2GLfm3ZaXdSxxlvm8MerM1nJY",
            authDomain: "appdetallesamor.firebaseapp.com",
            projectId: "appdetallesamor",
            storageBucket: "appdetallesamor.firebasestorage.app",
            messagingSenderId: "917968456649",
            appId: "1:917968456649:web:24759220e7e129a085b618",
            measurementId: "G-X2NGZ3HC41"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Obtener el ID de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const siteId = urlParams.get('id');

        if (!siteId) {
            document.getElementById('loading').innerHTML = '<p class="text-red-500 font-bold">Enlace no válido o incompleto ❌</p>';
        } else {
            try {
                const docRef = doc(db, "minisites", siteId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();

                    // Lectura de los campos de Firestore
                    document.getElementById('title').textContent = data.names || 'Nuestra Historia';
                    document.getElementById('date').textContent = data.specialDate ? `📅 ${data.specialDate}` : '';
                    document.getElementById('message').textContent = data.loveLetter || '';

                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('content').classList.remove('hidden');
                } else {
                    document.getElementById('loading').innerHTML = '<p class="text-red-500 font-bold">El minisitio no existe o fue eliminado 💔</p>';
                }
            } catch (error) {
                console.error("Error al obtener minisitio:", error);
                document.getElementById('loading').innerHTML = '<p class="text-red-500 font-bold">Error de conexión con la base de datos.</p>';
            }
        }
    </script>
</body>
</html>
