<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plataforma de Soluciones QR</title>

    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Google AdSense SDK -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2082458944224549" crossorigin="anonymous"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        burgundy: { 800: '#58111A', 900: '#3B0A11', 950: '#230408' },
                        rose: { 300: '#F472B6', 500: '#EC4899', 600: '#DB2777', 900: '#831843' },
                        gold: { 400: '#FBBF24', 500: '#F59E0B' }
                    },
                    fontFamily: { cursive: ['"Dancing Script"', 'cursive'], sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #230408 0%, #3B0A11 50%, #58111A 100%); color: #FCE7F3; min-height: 100vh; overflow-x: hidden; }
        .font-cursive { font-family: 'Dancing Script', cursive; }
    </style>
    <link rel="manifest" href="./manifest.json">
</head>
<body class="p-4 flex flex-col items-center justify-center min-h-screen relative">

    <!-- MENÚ PRINCIPAL (HUB DE BIENVENIDA) -->
    <div class="w-full max-w-md bg-burgundy-900/60 backdrop-blur-xl border border-rose-500/20 p-6 rounded-3xl shadow-2xl space-y-6 my-6">
        <div class="text-center space-y-1">
            <h1 class="text-3xl font-bold font-cursive text-rose-100">Soluciones QR</h1>
            <p class="text-xs text-rose-300/80">Selecciona el tipo de experiencia digital que deseas crear</p>
        </div>

        <!-- TARJETAS DE NAVEGACIÓN -->
        <div class="space-y-3.5">
            <!-- CATEGORÍA 1: PAREJAS -->
            <a href="./parejas/index.html" class="w-full p-4 bg-burgundy-950/80 hover:bg-burgundy-950 border border-rose-500/30 rounded-2xl flex items-center justify-between text-left transition-all active:scale-95 shadow-lg group block">
                <div class="flex items-center space-x-3.5">
                    <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-rose-500 to-rose-700 flex items-center justify-center text-white text-xl shadow-md">
                        ❤️
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-rose-100 group-hover:text-rose-300">Detalles de Amor</h3>
                        <p class="text-[10px] text-rose-300/70">Tarjeta interactiva, fotos, nota de voz y trivia</p>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-xs text-rose-400"></i>
            </a>

            <!-- CATEGORÍA 2: MENSAJE CON TEMPORIZADOR -->
            <a href="./temporizador/index.html" class="w-full p-4 bg-burgundy-950/80 hover:bg-burgundy-950 border border-amber-500/30 rounded-2xl flex items-center justify-between text-left transition-all active:scale-95 shadow-lg group block">
                <div class="flex items-center space-x-3.5">
                    <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-amber-500 to-amber-700 flex items-center justify-center text-white text-xl shadow-md">
                        ⏳
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-amber-100 group-hover:text-amber-300">Mensaje con Temporizador</h3>
                        <p class="text-[10px] text-amber-300/70">Cuenta regresiva previa al desbloqueo de sorpresa</p>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-xs text-amber-400"></i>
            </a>

            <!-- CATEGORÍA 3: MASCOTAS (HUELLA QR) -->
            <a href="./mascotas/index.html" class="w-full p-4 bg-burgundy-950/80 hover:bg-burgundy-950 border border-emerald-500/30 rounded-2xl flex items-center justify-between text-left transition-all active:scale-95 shadow-lg group block">
                <div class="flex items-center space-x-3.5">
                    <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-emerald-500 to-emerald-700 flex items-center justify-center text-white text-xl shadow-md">
                        🐾
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-emerald-100 group-hover:text-emerald-300">Huella QR (Mascotas)</h3>
                        <p class="text-[10px] text-emerald-300/70">Placa digital con datos de contacto de emergencia</p>
                    </div>
                </div>
                <i class="fas fa-chevron-right text-xs text-emerald-400"></i>
            </a>
        </div>
    </div>
</body>
</html>
