<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crear Detalle de Amor</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- QRCode JS Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        burgundy: { 800: '#58111A', 900: '#3B0A11', 950: '#230408' },
                        rose: { 300: '#F472B6', 500: '#EC4899', 600: '#DB2777', 900: '#831843' },
                        gold: { 400: '#FBBF24', 500: '#F59E0B' }
                    },
                    fontFamily: {
                        cursive: ['"Dancing Script"', 'cursive'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #230408 0%, #3B0A11 50%, #58111A 100%); color: #FCE7F3; min-height: 100vh; }
        .font-cursive { font-family: 'Dancing Script', cursive; }
    </style>
</head>
<body class="p-4 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-burgundy-900/60 backdrop-blur-xl border border-rose-500/20 p-6 rounded-3xl shadow-2xl space-y-6 my-6">
        
        <div class="text-center space-y-1">
            <h1 class="text-3xl font-bold font-cursive text-rose-100">Crear Detalle Especial</h1>
            <p class="text-xs text-rose-300/80">Personaliza tu regalo digital con recuerdos y música</p>
        </div>

        <form id="createForm" onsubmit="event.preventDefault(); guardarDetalle();" class="space-y-4">
            <!-- Nombres -->
            <div class="space-y-1">
                <label class="text-xs font-semibold text-rose-200">1. NOMBRES DEL DETALLE:</label>
                <input type="text" id="nombresInput" placeholder="Ej. Ana y Francisco" required class="w-full px-4 py-2.5 rounded-xl bg-burgundy-950/80 border border-rose-500/30 text-xs text-rose-100 placeholder-rose-400/50 focus:outline-none focus:border-rose-500">
            </div>

            <!-- Fecha especial -->
            <div class="space-y-1">
                <label class="text-xs font-semibold text-rose-200">2. FECHA ESPECIAL:</label>
                <input type="text" id="fechaInput" placeholder="Ej. 14 de Febrero de 2024" class="w-full px-4 py-2.5 rounded-xl bg-burgundy-950/80 border border-rose-500/30 text-xs text-rose-100 placeholder-rose-400/50 focus:outline-none focus:border-rose-500">
            </div>

            <!-- Galería de Fotos (Máximo 4 para estabilidad total) -->
            <div class="space-y-1">
                <label class="text-xs font-semibold text-rose-200">3. FOTOS PARA EL CARRUSEL (MÁXIMO 4):</label>
                <input type="file" id="photosInput" accept="image/*" multiple required class="w-full text-xs text-rose-300 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-rose-600 file:text-white hover:file:bg-rose-700 cursor-pointer bg-burgundy-950/80 rounded-xl border border-rose-500/30">
                <p class="text-[10px] text-rose-300/60">Selecciona hasta 4 de tus mejores fotos.</p>
            </div>

            <!-- Mensaje o carta -->
            <div class="space-y-1">
                <label class="text-xs font-semibold text-rose-200">4. CARTA DE AMOR / MENSAJE:</label>
                <textarea id="mensajeInput" rows="4" placeholder="Escribe tu mensaje aquí..." required class="w-full px-4 py-2.5 rounded-xl bg-burgundy-950/80 border border-rose-500/30 text-xs text-rose-100 placeholder-rose-400/50 focus:outline-none focus:border-rose-500 resize-none"></textarea>
            </div>

            <!-- Botón de Envío -->
            <button type="submit" id="saveBtn" class="w-full py-3 bg-gradient-to-r from-rose-500 to-rose-600 text-white text-xs font-bold uppercase tracking-wider rounded-xl shadow-lg active:scale-95 transition-transform flex items-center justify-center gap-2">
                🚀 Generar Enlace y Guardar en la Nube
            </button>
        </form>

        <!-- Indicador de Carga -->
        <div id="statusBox" class="hidden text-center py-4 space-y-2">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-rose-500 mx-auto"></div>
            <p id="statusText" class="text-xs text-rose-300">Optimizando fotos... Por favor espera.</p>
        </div>

        <!-- RESULTADO (ENLACE Y QR) -->
        <div id="resultBox" class="hidden text-center space-y-4 pt-4 border-t border-rose-500/20">
            <h3 class="text-sm font-bold text-rose-200">¡Tu detalle fue guardado con éxito! ❤️</h3>
            
            <div class="bg-white p-4 rounded-2xl inline-block shadow-xl">
                <div id="qrcode"></div>
            </div>

            <div class="space-y-2">
                <a id="finalLink" href="#" target="_blank" class="block w-full py-2.5 bg-rose-600/30 border border-rose-500 text-rose-100 text-xs font-semibold rounded-xl truncate px-4">
                    Abrir Detalle
                </a>
                <button onclick="copiarEnlace()" class="w-full py-2 bg-burgundy-950 text-xs text-rose-300 rounded-xl border border-rose-500/30">
                    <i class="fas fa-copy"></i> Copiar Enlace
                </button>
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC-PGLDqJ2GLfm3ZaXdSxxlvm8MerM1nJY",
            authDomain: "appdetallesamor.firebaseapp.com",
            projectId: "appdetallesamor",
            storageBucket: "appdetallesamor.firebasestorage.app",
            messagingSenderId: "917968456649",
            appId: "1:917968456649:web:32261e841942825685b618",
            measurementId: "G-ZTGDLNQXSF"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let generatedUrl = "";

        async function guardarDetalle() {
            const nombres = document.getElementById('nombresInput').value.trim();
            const fecha = document.getElementById('fechaInput').value.trim();
            const mensaje = document.getElementById('mensajeInput').value.trim();
            const photosFiles = document.getElementById('photosInput').files;

            if (photosFiles.length === 0) {
                alert("Por favor selecciona al menos una fotografía.");
                return;
            }

            document.getElementById('createForm').classList.add('hidden');
            document.getElementById('statusBox').classList.remove('hidden');

            try {
                // Comprimir imágenes de manera eficiente (máximo 4)
                const fotosBase64 = [];
                const maxFotos = Math.min(photosFiles.length, 4);
                
                for (let i = 0; i < maxFotos; i++) {
                    document.getElementById('statusText').innerText = `Optimizando foto ${i + 1} de ${maxFotos}...`;
                    const compressedBase64 = await compressImage(photosFiles[i], 600, 0.65);
                    fotosBase64.push(compressedBase64);
                }

                document.getElementById('statusText').innerText = "Guardando en la nube...";

                // Guardar en Firestore
                const docRef = await db.collection("detalles").add({
                    nombres: nombres,
                    fecha: fecha,
                    mensaje: mensaje,
                    fotos: fotosBase64,
                    creado: firebase.firestore.FieldValue.serverTimestamp()
                });

                generatedUrl = `https://axelkings988-hub.github.io/App-Detalles-Amor/ver.html?id=${docRef.id}`;

                document.getElementById('statusBox').classList.add('hidden');
                document.getElementById('resultBox').classList.remove('hidden');
                document.getElementById('finalLink').href = generatedUrl;

                document.getElementById('qrcode').innerHTML = "";
                new QRCode(document.getElementById("qrcode"), {
                    text: generatedUrl,
                    width: 160,
                    height: 160
                });

            } catch (error) {
                console.error("Error al guardar: ", error);
                alert("Ocurrió un error al guardar. Intenta con imágenes más ligeras.");
                document.getElementById('statusBox').classList.add('hidden');
                document.getElementById('createForm').classList.remove('hidden');
            }
        }

        function compressImage(file, maxWidth, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = error => reject(error);
                };
                reader.onerror = error => reject(error);
            });
        }

        function copiarEnlace() {
            if (generatedUrl) {
                navigator.clipboard.writeText(generatedUrl).then(() => {
                    alert("¡Enlace copiado al portapapeles! ❤️");
                });
            }
        }
    </script>
</body>
</html>
