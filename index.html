<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creador de Detalles - Panel App</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen pb-12 font-sans">

  <!-- CABECERA DE LA APP -->
  <header class="bg-pink-600 text-white p-4 shadow-md flex justify-between items-center">
    <h1 class="font-bold text-lg">❤️ Crear Nuevo Detalle</h1>
    <span class="bg-pink-500 text-xs px-2.5 py-1 rounded-full font-semibold">Modo App</span>
  </header>

  <!-- CONTENEDOR PRINCIPAL DEL FORMULARIO -->
  <main class="max-w-md mx-auto p-4 space-y-4">

    <div class="bg-white p-5 rounded-2xl shadow-sm space-y-4">
      
      <!-- SECCIÓN 1: INFORMACIÓN -->
      <div>
        <label class="block text-xs font-bold text-pink-700 uppercase mb-1">1. Nombres del Detalle</label>
        <input type="text" id="inputNombres" placeholder="Ej. Ana y Francisco" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-pink-500">
      </div>

      <div>
        <label class="block text-xs font-bold text-pink-700 uppercase mb-1">2. Fecha Especial</label>
        <input type="date" id="inputFecha" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-pink-500">
      </div>

      <!-- SECCIÓN 2: FOTOS Y MENSAJE -->
      <div>
        <label class="block text-xs font-bold text-pink-700 uppercase mb-1">3. Fotos para el Carrusel (Máx. 3)</label>
        <input type="file" id="inputFotos" accept="image/*" multiple class="w-full border border-gray-300 rounded-lg p-2 text-sm bg-gray-50 focus:outline-none">
        <p class="text-xs text-gray-400 mt-1">Selecciona hasta 3 imágenes de tu galería.</p>
      </div>

      <div>
        <label class="block text-xs font-bold text-pink-700 uppercase mb-1">4. Carta de Amor / Mensaje</label>
        <textarea id="inputMensaje" rows="4" placeholder="Escribe tu mensaje aquí..." class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:outline-none focus:border-pink-500"></textarea>
      </div>

      <!-- BOTÓN PRINCIPAL -->
      <button id="btnGuardar" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center gap-2">
        🚀 Generar Enlace y Guardar en la Nube
      </button>

    </div>

    <!-- SECCIÓN DE RESULTADO Y QR (OCULTA INICIALMENTE) -->
    <div id="seccionResultado" class="bg-white p-5 rounded-2xl shadow-sm text-center space-y-4 hidden">
      <h2 class="text-pink-600 font-bold text-base">¡DETALLE GENERADO CON ÉXITO! 🎉</h2>
      
      <!-- CONTENEDOR DEL CÓDIGO QR -->
      <div id="contenedorQR" class="flex justify-center p-3 bg-gray-50 rounded-xl border border-gray-100"></div>

      <!-- ENLACE Y ACCIONES -->
      <input type="text" id="inputEnlaceGenerado" readonly class="w-full border border-gray-200 bg-gray-50 rounded-lg p-2.5 text-xs text-gray-600 text-center focus:outline-none">

      <div class="grid grid-cols-2 gap-2 pt-2">
        <button id="btnCopiar" class="bg-pink-100 text-pink-700 font-semibold py-2.5 rounded-lg text-xs hover:bg-pink-200">
          📋 Copiar Enlace
        </button>
        <a id="btnAbrirDetalle" target="_blank" href="#" class="bg-pink-600 text-white font-semibold py-2.5 rounded-lg text-xs hover:bg-pink-700 flex items-center justify-center">
          🔗 Abrir Detalle
        </a>
      </div>
    </div>

  </main>

  <!-- MÓDULO FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Reemplaza con tu configuración de Firebase si es distinta
    const firebaseConfig = {
      apiKey: "AIzaSy...",
      authDomain: "tu-app.firebaseapp.com",
      projectId: "tu-app-id",
      storageBucket: "tu-app.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abc"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Convertir imágenes a Base64
    function convertirImagenesBase64(inputElement) {
      const archivos = Array.from(inputElement.files).slice(0, 3);
      return Promise.all(archivos.map(archivo => {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = error => reject(error);
          reader.readAsDataURL(archivo);
        });
      }));
    }

    const btnGuardar = document.getElementById('btnGuardar');
    const seccionResultado = document.getElementById('seccionResultado');
    const contenedorQR = document.getElementById('contenedorQR');
    const inputEnlaceGenerado = document.getElementById('inputEnlaceGenerado');
    const btnAbrirDetalle = document.getElementById('btnAbrirDetalle');
    const btnCopiar = document.getElementById('btnCopiar');

    btnGuardar.addEventListener('click', async () => {
      const nombres = document.getElementById('inputNombres').value.trim();
      const fecha = document.getElementById('inputFecha').value;
      const mensaje = document.getElementById('inputMensaje').value.trim();
      const inputFotos = document.getElementById('inputFotos');

      if (!nombres || !mensaje) {
        alert("Por favor completa al menos los nombres y el mensaje.");
        return;
      }

      btnGuardar.disabled = true;
      btnGuardar.innerText = "Guardando en la nube...";

      try {
        const fotosBase64 = await convertirImagenesBase64(inputFotos);

        const docRef = await addDoc(collection(db, "detalles"), {
          nombres: nombres,
          fecha: fecha,
          mensaje: mensaje,
          fotos: fotosBase64,
          creado: new Date()
        });

        // Construcción de la URL con ver.html e ID
        const urlFinal = `https://axelkings988-hub.github.io/App-Detalles-Amor/ver.html?id=${docRef.id}`;

        // Limpiar y generar QR
        contenedorQR.innerHTML = "";
        new QRCode(contenedorQR, {
          text: urlFinal,
          width: 180,
          height: 180,
          colorDark: "#db2777",
          colorLight: "#ffffff"
        });

        inputEnlaceGenerado.value = urlFinal;
        btnAbrirDetalle.href = urlFinal;
        seccionResultado.classList.remove('hidden');

      } catch (error) {
        console.error("Error al guardar:", error);
        alert("Hubo un error al guardar el detalle. Revisa la consola.");
      } finally {
        btnGuardar.disabled = false;
        btnGuardar.innerText = "🚀 Generar Enlace y Guardar en la Nube";
      }
    });

    btnCopiar.addEventListener('click', () => {
      navigator.clipboard.writeText(inputEnlaceGenerado.value);
      alert("¡Enlace copiado al portapapeles!");
    });
  </script>
</body>
</html>
